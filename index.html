<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mở trang web của bạn không quảng cáo</title>
    <script>
        (function () {
            if (/[?&]xstr=/.test(location.search)) {
                document.documentElement.classList.add('auto-xstr');
                document.body.classList.add('viewing');
            }
        })();
    </script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #setup-box {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #setup-box h3 {
            text-align: center;
            margin: 0 0 4px;
        }

        #base64-input {
            height: 120px;
            background: #222;
            color: #0f0;
            border: 1px solid #444;
            padding: 15px;
            font-family: monospace;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
        }

        .action-btn {
            padding: 15px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .action-btn:hover { background: #0069d9; }

        #viewer {
            display: none;
            flex: 1;
            position: relative;
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        body.viewing {
            display: flex;
            flex-direction: column;
        }

        body.viewing #setup-box { display: none; }
        body.viewing #viewer { display: block; flex: 1; min-height: 0; }

        html.auto-xstr #setup-box { display: none; }

        html.auto-xstr body {
            display: flex;
            flex-direction: column;
        }

        html.auto-xstr #viewer {
            display: block;
            flex: 1;
            min-height: 0;
        }

        #iframe-crop {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        #embed-frame {
            --crop-top: 100px;
            width: 100%;
            height: calc(100% + var(--crop-top));
            border: none;
            transform: translateY(calc(-1 * var(--crop-top)));
        }

        #error-msg {
            display: none;
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #e50914;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 110;
            max-width: 90%;
            text-align: center;
        }

        #block-screen {
            display: none;
            text-align: center;
            margin-top: 20vh;
            padding: 30px;
        }

        #block-screen h2 {
            color: #e50914;
            margin: 0 0 12px;
        }

        #block-screen p {
            color: #aaa;
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="block-screen">
        <h2>Truy cập bị từ chối</h2>
        <p>Vui lòng mở bằng điện thoại thật.<br>Không hỗ trợ máy tính hoặc chế độ giả lập mobile (F12).</p>
    </div>

    <div id="setup-box">
        <h3>Nhập dữ liệu</h3>
        <textarea id="base64-input" placeholder="Dán mã đã mã hoá — hoặc mở link ?xstr=..."></textarea>
        <button type="button" class="action-btn" id="open-btn">Xem ngay</button>
    </div>

    <div id="viewer">
        <div id="iframe-crop">
            <iframe id="embed-frame" title="Trang web nhúng" sandbox="allow-scripts allow-same-origin allow-forms allow-fullscreen"></iframe>
        </div>
    </div>

    <div id="error-msg"></div>

    <script>
        const ENABLE_MOBILE_BLOCKER = true;
        const SECRET_KEY = 'G0tbc7e9BrgUZiwGk1W3Y30M';

        const base64Input = document.getElementById('base64-input');
        const openBtn = document.getElementById('open-btn');
        const embedFrame = document.getElementById('embed-frame');
        const errorMsg = document.getElementById('error-msg');
        const blockScreen = document.getElementById('block-screen');
        const setupBox = document.getElementById('setup-box');
        const viewer = document.getElementById('viewer');

        let isBlocked = false;

        function isPhoneUserAgent() {
            if (navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') {
                return navigator.userAgentData.mobile;
            }
            const ua = navigator.userAgent;
            if (/iPhone|iPod/i.test(ua)) return true;
            if (/Android/i.test(ua) && /Mobile/i.test(ua)) return true;
            return false;
        }

        function isDesktopPlatform() {
            const platform = navigator.platform || '';
            const ua = navigator.userAgent;
            if (/Win32|Win64|Windows|MacIntel|Macintosh|Linux x86_64|Linux i686|CrOS/i.test(platform)) return true;
            if (/Windows|Macintosh|Linux/i.test(ua) && !/Mobile|Android|iPhone/i.test(ua)) return true;
            return false;
        }

        function isDevToolsEmulation() {
            if (window.outerWidth > 0 && Math.abs(window.outerWidth - window.innerWidth) > 140) return true;
            if (isPhoneUserAgent() && isDesktopPlatform()) return true;
            if (isPhoneUserAgent() && window.matchMedia('(hover: hover) and (pointer: fine)').matches) return true;
            const maxScreen = Math.max(screen.width, screen.height);
            if (isPhoneUserAgent() && maxScreen > 1100) return true;
            return false;
        }

        function lacksRealTouch() {
            return (navigator.maxTouchPoints || 0) < 1;
        }

        function isAllowedPhone() {
            if (!ENABLE_MOBILE_BLOCKER) return true;
            if (!isPhoneUserAgent()) return false;
            if (isDesktopPlatform()) return false;
            if (lacksRealTouch()) return false;
            if (isDevToolsEmulation()) return false;
            if (navigator.webdriver) return false;
            return true;
        }

        function triggerBlock() {
            if (isBlocked) return;
            isBlocked = true;
            setupBox.style.display = 'none';
            viewer.style.display = 'none';
            document.body.classList.remove('viewing');
            blockScreen.style.display = 'block';
            embedFrame.removeAttribute('src');
        }

        function runMobileGuard() {
            if (!ENABLE_MOBILE_BLOCKER) return;
            if (!isAllowedPhone()) triggerBlock();
        }

        runMobileGuard();
        window.addEventListener('resize', runMobileGuard);
        window.addEventListener('orientationchange', runMobileGuard);

        function xorProcess(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                const charCode = text.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                result += String.fromCharCode(charCode);
            }
            return result;
        }

        function decryptXOR(encodedText, key) {
            const cleaned = encodedText.trim().replace(/\s/g, '');
            const decodedBase64 = decodeURIComponent(escape(atob(cleaned)));
            return xorProcess(decodedBase64, key);
        }

        function decryptPayload(cipherText) {
            return decryptXOR(cipherText, SECRET_KEY).trim();
        }

        function getXstrFromUrl() {
            const match = window.location.search.match(/[?&]xstr=([^&#]*)/);
            if (!match || !match[1]) return null;
            try {
                return decodeURIComponent(match[1].replace(/\+/g, '%2B'));
            } catch {
                return match[1];
            }
        }

        function normalizeUrl(value) {
            if (/^https?:\/\//i.test(value)) return value;
            return 'https://' + value;
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        function processCipherData(cipherData) {
            if (isBlocked) return;

            if (!cipherData) {
                showError('Không có dữ liệu');
                return;
            }

            let decodedUrl;
            try {
                decodedUrl = decryptPayload(cipherData);
            } catch {
                showError('Mã không hợp lệ hoặc sai key');
                return;
            }

            let url;
            try {
                url = new URL(normalizeUrl(decodedUrl)).href;
            } catch {
                showError('Decode không ra URL hợp lệ');
                return;
            }

            localStorage.setItem('embedCipher', cipherData.trim());
            document.body.classList.add('viewing');
            embedFrame.src = url;
        }

        function handleManualSubmit() {
            processCipherData(base64Input.value.trim());
        }

        openBtn.addEventListener('click', handleManualSubmit);

        base64Input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleManualSubmit();
        });

        function initApp() {
            runMobileGuard();
            if (isBlocked) return;

            // ?xstr=... → dùng trực tiếp làm data, giải mã và mở iframe (không cần nhập tay)
            const xstr = getXstrFromUrl();
            if (xstr) {
                processCipherData(xstr);
                return;
            }

            const saved = localStorage.getItem('embedCipher');
            if (saved) base64Input.value = saved;
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
