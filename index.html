<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body.player-mode { overflow: hidden; }

        #setup-box {
            min-height: 100vh;
            padding: 24px 16px 40px;
            background: #0f1115;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-wrap {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        #history-panel {
            position: fixed;
            top: 24px;
            right: 16px;
            bottom: 24px;
            width: min(340px, 28vw);
            padding: 16px;
            border-radius: 16px;
            background: rgba(26, 29, 36, 0.94);
            border: 1px solid #2d3442;
            box-shadow: 0 14px 40px rgba(0,0,0,0.28);
            display: flex;
            flex-direction: column;
            z-index: 25;
        }
        .history-title {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }
        .history-note {
            margin: 0 0 12px;
            color: #aab4c4;
            font-size: 12px;
            line-height: 1.45;
        }
        .history-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 2px;
        }
        .history-empty {
            color: #8f9bad;
            font-size: 13px;
            line-height: 1.5;
            padding: 12px;
            border-radius: 12px;
            background: #151922;
        }
        .history-item {
            border: 1px solid #343b4b;
            border-radius: 12px;
            background: #202532;
            color: #fff;
            padding: 11px 12px;
            cursor: pointer;
            text-align: left;
        }
        .history-item:hover {
            border-color: #e50914;
            background: #262c3a;
        }
        .history-item-title {
            font-size: 14px;
            font-weight: 800;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .history-item-meta {
            margin-top: 5px;
            color: #aeb8c8;
            font-size: 12px;
        }
        #btn-history {
            display: none;
            position: fixed;
            right: 0;
            top: 48%;
            transform: translateY(-50%);
            z-index: 70;
            border: none;
            border-radius: 24px 0 0 24px;
            padding: 12px 10px 12px 14px;
            background: rgba(229, 9, 20, 0.88);
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        body.player-mode #btn-history {
            display: none !important;
        }
        #history-overlay,
        #confirm-overlay {
            position: fixed;
            inset: 0;
            z-index: 180;
            display: none;
            align-items: flex-end;
            justify-content: center;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(5px);
        }
        #history-overlay.show,
        #confirm-overlay.show {
            display: flex;
        }
        .history-popup,
        .confirm-card {
            width: 100%;
            max-height: 78vh;
            background: #1c1f29;
            border: 1px solid #333b4d;
            border-radius: 20px 20px 0 0;
            padding: 18px;
            box-shadow: 0 -12px 38px rgba(0,0,0,0.38);
        }
        .history-popup .history-list {
            max-height: calc(78vh - 96px);
        }
        .confirm-card {
            max-width: 420px;
            margin: auto 16px;
            border-radius: 18px;
            align-self: center;
        }
        .confirm-title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 800;
        }
        .confirm-message {
            margin: 0;
            color: #c5cede;
            font-size: 14px;
            line-height: 1.55;
        }
        .confirm-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .confirm-actions button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
        }
        #confirm-cancel { background: #303746; }
        #confirm-ok { background: #e50914; }
        @media (max-width: 1120px) {
            #history-panel {
                display: none;
            }
            #btn-history {
                display: block;
            }
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.45rem;
            color: #fff;
        }
        .hint {
            margin: 0 0 20px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.55;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            color: #bbb;
            font-size: 14px;
            font-weight: 600;
        }
        #encryptedInput,
        #passwordInput {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1d24;
            color: #e8e8e8;
            font-size: 15px;
            font-family: ui-monospace, Consolas, monospace;
        }
        #passwordInput {
            margin-top: 10px;
        }
        #encryptedInput:focus,
        #passwordInput:focus {
            outline: none;
            border-color: #e50914;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary { background: #e50914; }
        .btn-secondary { background: #2a3142; }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .status {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .status.show { display: block; }
        .status.loading { background: #1e3a5f; color: #9ecfff; }
        .status.ok { background: #1a3d2a; color: #9effb4; }
        .status.error { background: #3d1a1a; color: #ffb4b4; }
        .status-loading-content {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }
        .status-loading-content .loading-spinner {
            width: 24px;
            height: 24px;
            flex: 0 0 auto;
            margin: 1px 0 0;
            border-width: 3px;
        }
        .status-loading-title {
            font-weight: 700;
            color: #d7ecff;
        }
        .status-loading-note {
            margin-top: 5px;
            color: #b8d6f4;
            font-size: 13px;
            line-height: 1.45;
        }
        .hidden-control { display: none !important; }
        .meta {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #1a1d24;
            color: #cfd7e6;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }
        .meta.show { display: block; }
        .meta strong { color: #7eb8ff; }

        #preview-box {
            display: none;
            margin-top: 18px;
        }
        #preview-box.show { display: block; }
        #preview-title {
            margin: 0 0 10px;
            color: #ddd;
            font-size: 1rem;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
            max-height: 320px;
            overflow: auto;
            padding-right: 4px;
        }
        .preview-ep {
            padding: 10px;
            border-radius: 8px;
            background: #252b38;
            color: #dce9ff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        #movie-box {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            position: relative;
        }
        #player-shell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
        }
        #vidPlayer {
            width: 100%;
            flex: 1;
            min-height: 0;
            max-height: calc(100vh - 72px);
            max-height: calc(100dvh - 72px);
            object-fit: contain;
            background: #000;
            outline: none;
        }
        video::cue { color: transparent; background: transparent; }
        #custom-sub {
            position: absolute;
            top: 66.67%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -2px -2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #video-watermark {
            position: absolute;
            top: 26%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-24deg);
            width: 90%;
            text-align: center;
            font-size: clamp(14px, 4.5vw, 22px);
            font-weight: 600;
            color: #fff;
            opacity: 0.35;
            pointer-events: none;
            z-index: 12;
            user-select: none;
            white-space: nowrap;
        }
        #player-loading {
            position: absolute;
            inset: 0;
            z-index: 18;
            display: none;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(0,0,0,0.34), rgba(0,0,0,0.62));
            pointer-events: none;
        }
        #player-loading.show {
            display: flex;
        }
        .loading-card {
            min-width: 150px;
            padding: 14px 18px;
            border-radius: 14px;
            background: rgba(10, 10, 10, 0.72);
            color: #fff;
            text-align: center;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
            backdrop-filter: blur(6px);
        }
        .loading-spinner {
            width: 34px;
            height: 34px;
            margin: 0 auto 10px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.26);
            border-top-color: #e50914;
            animation: spin 0.85s linear infinite;
        }
        #player-loading-text {
            font-size: 14px;
            font-weight: 700;
            line-height: 1.35;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 7px 12px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
        }
        #progress-bar {
            width: 100%;
            height: 8px;
            padding: 0;
            border: 0;
            margin: 0 0 7px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e50914;
            cursor: pointer;
        }
        #progress-bar::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            background: #e50914;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 19px;
            cursor: pointer;
            padding: 3px 6px;
            line-height: 1;
            flex-shrink: 0;
        }
        #episode-title {
            min-width: 0;
            flex: 1;
            color: #ddd;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #time-display {
            color: #ddd;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        #movie-box:fullscreen,
        #movie-box:-webkit-full-screen,
        #movie-box.fs-active {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
        }
        #movie-box.fs-active {
            position: fixed !important;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        #top-actions {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 35;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        #btn-back,
        #btn-reload {
            pointer-events: auto;
            border: none;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #episode-side-controls {
            display: none;
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 30;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        #movie-box.show-player #episode-side-controls { display: flex; }
        #fab-episodes,
        #fab-history-player,
        #fab-next-ep {
            background-color: rgba(229, 9, 20, 0.45);
            color: #fff;
            border: none;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            touch-action: manipulation;
        }
        #fab-episodes,
        #fab-history-player {
            border-radius: 30px 0 0 30px;
            padding: 12px 16px 12px 20px;
            font-size: 15px;
            font-weight: bold;
        }
        #fab-next-ep {
            border-radius: 30px 0 0 30px;
            padding: 10px 16px 10px 20px;
            font-size: 20px;
            line-height: 1;
        }
        #fab-episodes:hover,
        #fab-history-player:hover,
        #fab-next-ep:hover:not(:disabled) {
            opacity: 0.95;
            background-color: rgba(229, 9, 20, 0.9);
        }
        #fab-next-ep:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .fab-text { display: inline; }

        @media (max-width: 600px) {
            #episode-side-controls {
                gap: 5px;
            }
            #fab-episodes,
            #fab-history-player,
            #fab-next-ep {
                width: 42px;
                height: 42px;
                padding: 0;
                border-radius: 22px 0 0 22px;
                font-size: 18px;
                line-height: 42px;
                text-align: center;
            }
            #fab-next-ep {
                font-size: 19px;
            }
            .fab-text {
                display: none;
            }
        }

        #popup-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 110;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #popup-content {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #1c1c1c;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s ease;
        }
        #popup-overlay.show {
            display: block;
            opacity: 1;
        }
        #popup-overlay.show #popup-content { bottom: 0; }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .popup-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }
        .list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .ep-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            padding: 13px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }
        .ep-btn.active {
            background: #e50914;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="setup-box">
        <div class="setup-wrap">
            <input id="encryptedInput" placeholder="Nhập mã" spellcheck="false" autocomplete="off">
            <input id="passwordInput" type="password" value="1234" placeholder="Mật khẩu giải mã" spellcheck="false" autocomplete="current-password">

            <div class="row">
                <button type="button" class="btn btn-primary" id="btnLoad">Lấy dữ liệu</button>
            </div>

            <div id="status" class="status"></div>
        </div>
        <aside id="history-panel" aria-label="Lịch sử phim đã lưu">
            <h2 class="history-title">Phim đã lưu</h2>
            <p class="history-note">Chọn phim đã lấy dữ liệu trước đó để xem lại nhanh.</p>
            <div class="history-list" id="historyListDesktop"></div>
        </aside>
    </div>

    <button type="button" id="btn-history">History</button>

    <div id="history-overlay" aria-hidden="true">
        <div class="history-popup">
            <div class="popup-header">
                <h3>Phim đã lưu</h3>
                <button type="button" class="close-btn" id="history-close">&times;</button>
            </div>
            <div class="history-list" id="historyListPopup"></div>
        </div>
    </div>

    <div id="confirm-overlay" aria-hidden="true">
        <div class="confirm-card">
            <h3 class="confirm-title">Lấy dữ liệu mới nhất?</h3>
            <p class="confirm-message">Dữ liệu cũ sẽ được xoá đi để lấy mới dữ liệu. Bạn chắc chứ?</p>
            <div class="confirm-actions">
                <button type="button" id="confirm-cancel">Huỷ</button>
                <button type="button" id="confirm-ok">Đồng ý</button>
            </div>
        </div>
    </div>

    <div id="movie-box">
        <div id="top-actions">
            <button type="button" id="btn-back">← Nhập mã khác</button>
            <button type="button" id="btn-reload">Lấy dữ liệu mới nhất</button>
        </div>

        <div id="player-shell">
            <video id="vidPlayer" playsinline preload="metadata"></video>
            <div id="video-watermark" aria-hidden="true">syhsuah daushd oasdu aodsiu aiud authorization</div>
            <div id="custom-sub"></div>
            <div id="player-loading" aria-live="polite" aria-hidden="true">
                <div class="loading-card">
                    <div class="loading-spinner" aria-hidden="true"></div>
                    <div id="player-loading-text">Đang tải phim...</div>
                </div>
            </div>
            <div id="player-controls">
                <input type="range" id="progress-bar" min="0" max="1000" value="0" step="1" aria-label="Tiến trình phát">
                <div class="controls-row">
                    <button type="button" class="ctrl-btn" id="btn-play" aria-label="Phát / Tạm">▶</button>
                    <span id="episode-title">Chưa chọn tập</span>
                    <span id="time-display">0:00 / 0:00</span>
                    <button type="button" class="ctrl-btn" id="btn-fs" aria-label="Toàn màn hình">⛶</button>
                </div>
            </div>
        </div>

        <div id="episode-side-controls">
            <button type="button" id="fab-episodes" aria-label="Chọn tập" title="Chọn tập">☰ <span class="fab-text">Chọn Tập</span></button>
            <button type="button" id="fab-history-player" aria-label="History" title="History">↺ <span class="fab-text">History</span></button>
            <button type="button" id="fab-next-ep" aria-label="Tập tiếp theo" title="Tập tiếp theo">▼</button>
        </div>

        <div id="popup-overlay" onclick="togglePopup(false)">
            <div id="popup-content" onclick="event.stopPropagation()">
                <div class="popup-header">
                    <h3>Danh sách tập</h3>
                    <button class="close-btn" onclick="togglePopup(false)">&times;</button>
                </div>
                <div class="list-container" id="epList"></div>
            </div>
        </div>
    </div>

    <script>
        let subtitleCues = [];
        let subtitleSyncToken = 0;
        let subtitleTimeUpdateHandler = null;
        let subtitleSeekedHandler = null;
        let hlsInstance = null;
        let playerUiBound = false;
        let isSeeking = false;
        let episodesList = [];
        let currentEpisodeIndex = 0;
        let currentMovieTitle = '';
        let lastSessionSaveAt = 0;
        let playerLoadingTimer = null;
        let stalledLoadingTimer = null;
        let playbackToken = 0;
        let isSwitchingEpisode = false;
        let pendingRefreshRequest = null;
        let hlsProxyBaseUrl = '';
        let currentSourceType = '';
        const API_BASE = '/api';
        const SESSION_KEY = 'movieCrawlerPlayerState';
        const LOCAL_CACHE_KEY = 'movieCrawlerPlayerLocalCache';
        const HISTORY_CACHE_KEY = 'movieCrawlerPlayerHistoryCache';
        const MAX_HISTORY_ITEMS = 10;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function showPlayerLoading(message, delayMs) {
            const overlay = document.getElementById('player-loading');
            const text = document.getElementById('player-loading-text');
            if (!overlay || !text) return;

            clearTimeout(playerLoadingTimer);
            text.textContent = message || 'Đang tải phim...';
            playerLoadingTimer = setTimeout(function() {
                overlay.classList.add('show');
                overlay.setAttribute('aria-hidden', 'false');
            }, delayMs == null ? 180 : delayMs);
        }

        function hidePlayerLoading() {
            const overlay = document.getElementById('player-loading');
            if (!overlay) return;

            clearTimeout(playerLoadingTimer);
            clearTimeout(stalledLoadingTimer);
            playerLoadingTimer = null;
            stalledLoadingTimer = null;
            overlay.classList.remove('show');
            overlay.setAttribute('aria-hidden', 'true');
        }

        function showStalledLoadingIfNeeded(player) {
            clearTimeout(stalledLoadingTimer);

            const startTime = player.currentTime || 0;
            stalledLoadingTimer = setTimeout(function() {
                const currentTime = player.currentTime || 0;
                const isStillStalled = Math.abs(currentTime - startTime) < 0.05;

                if (!player.paused && !player.ended && !isSeeking && isStillStalled) {
                    showPlayerLoading('Đang tải thêm...', 0);
                }
            }, 2000);
        }

        function setStatus(type, message) {

            if (type === 'loading') {

                ].join('');

            el.textContent = message;

        function hideStatus() {

        function getCurrentSessionKey() {
            const encryptedText = document.getElementById('encryptedInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            return encryptedText + '\n' + password;
        }

        function getCurrentInputState() {
            return {
                encryptedText: document.getElementById('encryptedInput').value.trim(),
                password: document.getElementById('passwordInput').value
            };
        }

        function readHistoryState() {
            try {
                const raw = localStorage.getItem(HISTORY_CACHE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];

                if (Array.isArray(parsed)) {
                    return parsed.filter(function(item) {
                        return item && item.cacheKey && Array.isArray(item.episodes) && item.episodes.length;
                    });
                }
            } catch (error) {}

            try {
                const legacyRaw = localStorage.getItem(LOCAL_CACHE_KEY);
                const legacy = legacyRaw ? JSON.parse(legacyRaw) : null;

                if (legacy && legacy.cacheKey && Array.isArray(legacy.episodes) && legacy.episodes.length) {
                    return [legacy];
                }
            } catch (error) {}

            return [];
        }

        function writeHistoryState(items) {
            try {
                localStorage.setItem(HISTORY_CACHE_KEY, JSON.stringify(items.slice(0, MAX_HISTORY_ITEMS)));
                localStorage.removeItem(LOCAL_CACHE_KEY);
            } catch (error) {}
        }

        function getHistoryTitle(state) {
            if (state.movieTitle) return state.movieTitle;
            if (state.title) return state.title;
            if (state.protectedPayload && state.protectedPayload.Title) return state.protectedPayload.Title;
            if (state.episodes && state.episodes[0]) return state.episodes[0].name || ('Tập ' + state.episodes[0].ep);
            return 'Phim đã lưu';
        }

        function getHistoryMeta(state) {
            const count = Array.isArray(state.episodes) ? state.episodes.length : 0;
            const savedAt = state.savedAt ? new Date(state.savedAt) : null;
            const timeText = savedAt && !Number.isNaN(savedAt.getTime())
                ? savedAt.toLocaleString('vi-VN')
                : '';

            return count + ' tập' + (timeText ? ' • ' + timeText : '');
        }

        function saveSessionState(extra) {
            if (!episodesList.length) return;

            const player = document.getElementById('vidPlayer');
            const inputState = getCurrentInputState();
            const state = {
                cacheKey: getCurrentSessionKey(),
                encryptedText: inputState.encryptedText,
                password: inputState.password,
                movieTitle: currentMovieTitle || '',
                sourceType: currentSourceType || '',
                episodes: episodesList,
                currentEpisodeIndex: currentEpisodeIndex,
                currentTime: player && isFinite(player.currentTime) ? player.currentTime : 0,
                savedAt: Date.now(),
                ...(extra || {})
            };

            try {
                const serializedState = JSON.stringify(state);
                sessionStorage.setItem(SESSION_KEY, serializedState);
                upsertHistoryState(state);
            } catch (error) {}
        }

        function upsertHistoryState(state) {
            const history = readHistoryState();
            const nextHistory = [
                state,
                ...history.filter(function(item) {
                    return item.cacheKey !== state.cacheKey;
                })
            ].slice(0, MAX_HISTORY_ITEMS);

            writeHistoryState(nextHistory);
            renderHistoryLists();
        }

        function readSessionState() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                if (raw) return JSON.parse(raw);
            } catch (error) {}

            try {
                const history = readHistoryState();
                const currentKey = getCurrentSessionKey();
                const matched = history.find(function(item) {
                    return item.cacheKey === currentKey;
                });

                if (matched) {
                    return matched;
                }

                if (history.length) {
                    return history[0];
                }

                const raw = localStorage.getItem(LOCAL_CACHE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                return null;
            }
        }

        function clearSessionState() {
            try {
                sessionStorage.removeItem(SESSION_KEY);
            } catch (error) {}
        }

        function removeHistoryItem(cacheKey) {
            const nextHistory = readHistoryState().filter(function(item) {
                return item.cacheKey !== cacheKey;
            });

            writeHistoryState(nextHistory);
            renderHistoryLists();
        }

        function renderHistoryLists() {
            const history = readHistoryState();
            const containers = [
                document.getElementById('historyListDesktop'),
                document.getElementById('historyListPopup')
            ].filter(Boolean);

            containers.forEach(function(container) {
                container.innerHTML = '';

                if (!history.length) {

                    empty.className = 'history-empty';
                    empty.textContent = 'Chưa có phim nào được lưu. Sau khi lấy dữ liệu thành công, phim sẽ xuất hiện ở đây.';
                    container.appendChild(empty);
                    return;
                }

                history.forEach(function(item) {
