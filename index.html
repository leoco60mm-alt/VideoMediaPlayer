<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giải mã dữ liệu NetShort</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1115;
            color: #e8e8e8;
            min-height: 100vh;
            padding: 24px 16px 40px;
        }
        .wrap { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; color: #fff; }
        .hint { font-size: 0.85rem; color: #888; margin-bottom: 20px; line-height: 1.5; }
        label { display: block; font-size: 0.9rem; color: #aaa; margin-bottom: 6px; }
        #urlInput {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1d24;
            color: #0f0;
            font-size: 14px;
            font-family: ui-monospace, monospace;
        }
        #urlInput:focus { outline: none; border-color: #007bff; }
        .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #e50914; color: #fff; }
        .btn-primary:hover { background: #c40812; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: #2a3142; color: #fff; }
        .btn-secondary:hover { background: #3a4458; }
        .meta {
            margin-top: 16px;
            padding: 12px 14px;
            background: #1a1d24;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
            display: none;
        }
        .meta.show { display: block; }
        .meta strong { color: #7eb8ff; }
        .status {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .status.show { display: block; }
        .status.loading { background: #1e3a5f; color: #9ecfff; }
        .status.error { background: #3d1a1a; color: #ffb4b4; white-space: pre-wrap; }
        .status.ok { background: #1a3d2a; color: #9effb4; }
        #epList {
            margin-top: 20px;
            display: none;
        }
        #epList.show { display: block; }
        #epList h2 { font-size: 1rem; margin: 0 0 12px; color: #ccc; }
        .ep-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .ep-item {
            display: block;
            padding: 10px 12px;
            background: #2a3142;
            border-radius: 8px;
            font-size: 13px;
            color: #cde4ff;
            text-decoration: none;
            transition: background 0.15s;
            word-break: break-all;
        }
        .ep-item:hover { background: #3a4458; }
        .ep-item .ep-num { font-weight: 700; color: #fff; display: block; margin-bottom: 4px; }
        code { background: #252830; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Giải mã dữ liệu NetShort</h1>
        <p class="hint">
            Dán mã chia sẻ <code>MSC1...</code>, link NetShort, hoặc externalId. Nếu là mã MSC1,
            trang sẽ hỏi mật khẩu để giải mã externalId. Sau đó frontend gọi <code>/api/detail</code>
            trên Vercel để server fetch trang detail và quét tập, tránh CORS của trình duyệt.
        </p>

        <label for="urlInput">Mã chia sẻ / Link phim / externalId</label>
        <input type="text" id="urlInput" placeholder="MSC1.salt.iv.tag.ciphertext hoặc https://netshort.com/episode/…-2057347000768663553" spellcheck="false">

        <div class="row">
            <button type="button" class="btn btn-primary" id="btnScan">Giải mã dữ liệu</button>
            <button type="button" class="btn btn-secondary" id="btnCopy" disabled>Sao chép JSON</button>
        </div>

        <div id="meta" class="meta"></div>
        <div id="status" class="status"></div>

        <div id="epList">
            <h2 id="epCount"></h2>
            <div class="ep-grid" id="epGrid"></div>
        </div>

    </div>

    <script>
        const DRAMAFREN_BASE = 'https://netshort.dramafren.org/';

        let lastEpisodes = [];
        let lastMovieId = null;

        function isEncryptedShareCode(input) {
            return /^MSC1\./i.test((input || '').trim());
        }

        function base64UrlToBytes(value) {
            let normalized = value.replace(/-/g, '+').replace(/_/g, '/');
            while (normalized.length % 4) normalized += '=';
            const binary = atob(normalized);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function concatBytes(a, b) {
            const out = new Uint8Array(a.length + b.length);
            out.set(a, 0);
            out.set(b, a.length);
            return out;
        }

        async function deriveAesGcmKey(password, salt) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw',
                enc.encode(password),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256',
                },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decryptExternalId(shareCode, password) {
            const parts = shareCode.trim().split('.');
            if (parts.length !== 5 || parts[0].toUpperCase() !== 'MSC1') {
                throw new Error('Mã chia sẻ không đúng format MSC1.{salt}.{iv}.{tag}.{ciphertext}');
            }
            if (!window.crypto || !crypto.subtle) {
                throw new Error('Trình duyệt không hỗ trợ WebCrypto ở ngữ cảnh hiện tại. Hãy mở qua http://localhost hoặc HTTPS.');
            }

            const salt = base64UrlToBytes(parts[1]);
            const iv = base64UrlToBytes(parts[2]);
            const tag = base64UrlToBytes(parts[3]);
            const ciphertext = base64UrlToBytes(parts[4]);
            const encryptedPayload = concatBytes(ciphertext, tag);
            const key = await deriveAesGcmKey(password, salt);
            const aad = new TextEncoder().encode('MSC1');

            const plainBuffer = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    additionalData: aad,
                    tagLength: 128,
                },
                key,
                encryptedPayload
            );

            return new TextDecoder().decode(plainBuffer).trim();
        }

        async function resolveMovieIdFromInput(input) {
            const raw = (input || '').trim();
            if (!raw) return null;

            if (isEncryptedShareCode(raw)) {
                const password = prompt('Nhập mật khẩu để giải mã dữ liệu (để trống nếu không có):', '');
                if (password === null) throw new Error('Đã hủy nhập mật khẩu.');

                let externalId;
                try {
                    externalId = await decryptExternalId(raw, password);
                } catch (err) {
                    throw new Error('Giải mã thất bại. Kiểm tra mật khẩu hoặc mã chia sẻ.\n' + (err.message || err));
                }

                if (!/^\d{10,}$/.test(externalId)) {
                    throw new Error('Giải mã thành công nhưng externalId không hợp lệ: ' + externalId);
                }
                return externalId;
            }

            if (/^\d{10,}$/.test(raw)) return raw;
            return extractMovieId(raw);
        }

        function extractMovieId(input) {
            const raw = (input || '').trim();
            if (!raw) return null;
            try {
                const u = new URL(raw);
                const m = u.pathname.match(/-(\d{10,})\/?$/);
                if (m) return m[1];
            } catch (_) {}
            const m2 = raw.match(/-(\d{10,})\/?$/);
            return m2 ? m2[1] : null;
        }

        function buildDetailUrl(movieId) {
            return DRAMAFREN_BASE + 'index.php?page=detail&id=' + encodeURIComponent(movieId);
        }

        function resolveWatchUrl(href, movieId) {
            if (!href) return null;
            const decoded = href.replace(/&amp;/g, '&');
            try {
                return new URL(decoded, DRAMAFREN_BASE).href;
            } catch (_) {
                return DRAMAFREN_BASE + decoded.replace(/^\//, '');
            }
        }

        function parseEpisodesFromHtml(html, movieId) {
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const seen = new Map();

            doc.querySelectorAll('a[href*="page=watch"]').forEach(function (a) {
                const href = a.getAttribute('href') || '';
                const epMatch = href.match(/[?&]ep=(\d+)/i);
                if (!epMatch) return;
                const ep = parseInt(epMatch[1], 10);
                if (!ep || seen.has(ep)) return;

                const idMatch = href.match(/[?&]id=(\d+)/i);
                const id = idMatch ? idMatch[1] : movieId;
                const fullUrl = resolveWatchUrl(href, id);
                const label = (a.textContent || '').trim() || ('Ep ' + ep);

                seen.set(ep, {
                    ep: ep,
                    name: label,
                    watchUrl: fullUrl,
                    href: href
                });
            });

            return Array.from(seen.values()).sort(function (a, b) { return a.ep - b.ep; });
        }

        function setStatus(type, message) {
            const el = document.getElementById('status');
            el.className = 'status show ' + type;
            el.textContent = message;
        }

        function hideStatus() {
            document.getElementById('status').className = 'status';
        }

        function showMeta(movieId, detailUrl) {
            const el = document.getElementById('meta');
            el.className = 'meta show';
            el.innerHTML =
                '<strong>ID phim:</strong> ' + movieId + '<br>' +
                '<strong>URL detail:</strong> <a href="' + detailUrl + '" target="_blank" rel="noopener">' + detailUrl + '</a>';
        }

        function renderEpisodes(episodes) {
            lastEpisodes = episodes;
            const list = document.getElementById('epList');
            const grid = document.getElementById('epGrid');
            const countEl = document.getElementById('epCount');
            document.getElementById('btnCopy').disabled = episodes.length === 0;

            if (!episodes.length) {
                list.classList.remove('show');
                grid.innerHTML = '';
                return;
            }

            list.classList.add('show');
            countEl.textContent = 'Danh sách tập (' + episodes.length + ' tập, không trùng):';
            grid.innerHTML = episodes.map(function (item) {
                return '<a class="ep-item" href="' + item.watchUrl + '" target="_blank" rel="noopener">' +
                    '<span class="ep-num">' + escapeHtml(item.name) + '</span>' +
                    '<span>' + escapeHtml(item.watchUrl) + '</span></a>';
            }).join('');
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function fetchHtml(url) {
            const target = new URL(url);
            const movieId = target.searchParams.get('id');
            const apiUrl = '/api/detail?id=' + encodeURIComponent(movieId);
            const res = await fetch(apiUrl, {
                method: 'GET',
                headers: { Accept: 'text/html' },
            });
            const text = await res.text();
            if (!res.ok) {
                try {
                    const data = JSON.parse(text);
                    throw new Error(
                        'API fetch HTTP ' + res.status +
                        (data.status ? ' / upstream ' + data.status : '') +
                        (data.snippet ? '\n' + data.snippet : '') +
                        (data.message ? '\n' + data.message : '')
                    );
                } catch (parseErr) {
                    if (parseErr.message && parseErr.message.startsWith('API fetch HTTP')) throw parseErr;
                    throw new Error('API fetch HTTP ' + res.status + '\n' + text.slice(0, 500));
                }
            }
            if (!text || text.length < 200) throw new Error('Response quá ngắn hoặc rỗng.');
            return text;
        }

        function finishScan(movieId, episodes, viaNote) {
            if (!episodes.length) {
                setStatus('error', 'Không tìm thấy link tập (page=watch&ep=) trong HTML.');
                renderEpisodes([]);
                return;
            }
            renderEpisodes(episodes);
            const note = viaNote ? ' (' + viaNote + ')' : '';
            setStatus('ok', 'Quét xong: ' + episodes.length + ' tập' + note + '.');
        }

        async function scanEpisodes() {
            const input = document.getElementById('urlInput').value.trim();
            let movieId;
            try {
                movieId = await resolveMovieIdFromInput(input);
            } catch (err) {
                setStatus('error', err.message || String(err));
                document.getElementById('meta').className = 'meta';
                document.getElementById('epList').classList.remove('show');
                document.getElementById('btnCopy').disabled = true;
                return;
            }

            if (!movieId) {
                setStatus('error', 'Không lấy được externalId. Hãy nhập mã MSC1, externalId, hoặc link NetShort có ID ở cuối URL.');
                document.getElementById('meta').className = 'meta';
                document.getElementById('epList').classList.remove('show');
                document.getElementById('btnCopy').disabled = true;
                return;
            }

            lastMovieId = movieId;
            const detailUrl = buildDetailUrl(movieId);
            showMeta(movieId, detailUrl);

            const btn = document.getElementById('btnScan');
            btn.disabled = true;
            setStatus('loading', 'Đang fetch trang detail…');
            document.getElementById('epList').classList.remove('show');

            try {
                const html = await fetchHtml(detailUrl);
                const episodes = parseEpisodesFromHtml(html, movieId);
                finishScan(movieId, episodes);
            } catch (err) {
                console.error(err);
                setStatus('error', err.message || String(err));
                renderEpisodes([]);
            } finally {
                btn.disabled = false;
            }
        }

        document.getElementById('btnScan').addEventListener('click', scanEpisodes);
        document.getElementById('btnCopy').addEventListener('click', function () {
            if (!lastEpisodes.length) return;
            const json = JSON.stringify(lastEpisodes, null, 2);
            navigator.clipboard.writeText(json).then(function () {
                setStatus('ok', 'Đã sao chép JSON (' + lastEpisodes.length + ' tập).');
            }).catch(function () {
                prompt('Sao chép JSON:', json);
            });
        });
        document.getElementById('urlInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') scanEpisodes();
        });
    </script>
</body>
</html>
