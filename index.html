                    btn.type = 'button';
                    btn.className = 'history-item';
                    btn.innerHTML = [
                        '<div class="history-item-title"></div>',
                        '<div class="history-item-meta"></div>'
                    ].join('');
                    btn.querySelector('.history-item-title').textContent = getHistoryTitle(item);
                    btn.querySelector('.history-item-meta').textContent = getHistoryMeta(item);
                    btn.addEventListener('click', function() {
                        selectHistoryItem(item.cacheKey);
                    });
                    container.appendChild(btn);
                });
            });
        }

        function toggleHistoryPopup(show) {
            const overlay = document.getElementById('history-overlay');
            if (!overlay) return;

            overlay.classList.toggle('show', Boolean(show));
            overlay.setAttribute('aria-hidden', show ? 'false' : 'true');
        }

        function selectHistoryItem(cacheKey) {
            const item = readHistoryState().find(function(entry) {
                return entry.cacheKey === cacheKey;
            });

            if (!item) {
                renderHistoryLists();
                return;
            }

            const encryptedInput = document.getElementById('encryptedInput');
            const passwordInput = document.getElementById('passwordInput');
            if (encryptedInput && item.encryptedText) encryptedInput.value = item.encryptedText;
            if (passwordInput && item.password != null) passwordInput.value = item.password;

            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(item));
            } catch (error) {}

            currentMovieTitle = getHistoryTitle(item);
            toggleHistoryPopup(false);

            const episodes = item.episodes
                .map(normalizeEpisode)
                .filter(ep => ep.videoUrl);

            episodesList = episodes;

            renderEpisodes(
                episodes,
                item.currentEpisodeIndex || 0,
                item.currentTime || 0
            );

            enterPlayerMode();
        }

        function base64UrlToBytes(value) {
            let normalized = value.replace(/-/g, '+').replace(/_/g, '/');
            while (normalized.length % 4) normalized += '=';
            const binary = atob(normalized);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function concatBytes(a, b) {
            const out = new Uint8Array(a.length + b.length);
            out.set(a, 0);
            out.set(b, a.length);
            return out;
        }

        async function deriveAesGcmKey(password, salt) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw',
                enc.encode(password || ''),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decryptShareCode(shareCode, password) {
            const parts = (shareCode || '').trim().split('.');
            if (parts.length !== 5 || parts[0].toUpperCase() !== 'MSC1') {
                throw new Error('Dữ liệu mã hoá phải có format MSC1.{salt}.{iv}.{tag}.{ciphertext}');
            }
            if (!window.crypto || !crypto.subtle) {
                throw new Error('Trình duyệt không hỗ trợ WebCrypto. Hãy mở bằng http://localhost hoặc HTTPS.');
            }

            const salt = base64UrlToBytes(parts[1]);
            const iv = base64UrlToBytes(parts[2]);
            const tag = base64UrlToBytes(parts[3]);
            const ciphertext = base64UrlToBytes(parts[4]);
            const encryptedPayload = concatBytes(ciphertext, tag);
            const key = await deriveAesGcmKey(password, salt);
            const aad = new TextEncoder().encode('MSC1');

            const plainBuffer = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    additionalData: aad,
                    tagLength: 128
                },
                key,
                encryptedPayload
            );

            return new TextDecoder().decode(plainBuffer).trim();
        }

        function parseMyUrlFromShareCodePlaintext(plaintext) {
            const trimmed = (plaintext || '').trim();
            let watchUrl;

            try {
                watchUrl = new URL(trimmed);
            } catch (error) {
                throw new Error('Giải mã thành công nhưng dữ liệu không phải URL hợp lệ.');
            }

            const protectedData = watchUrl.searchParams.get('data');
            if (!protectedData || !/^MSU1\./i.test(protectedData)) {
                throw new Error('Link bảo vệ không hợp lệ: thiếu tham số data=MSU1...');
            }

            return watchUrl.toString();
        }

        async function resolveProtectedWatchUrl(encryptedText, password) {
            const raw = (encryptedText || '').trim();
            if (!raw) {
                throw new Error('Chưa nhập dữ liệu đã mã hoá.');
            }

            let decryptedText;
            try {
                decryptedText = await decryptShareCode(raw, password || '');
            } catch (error) {
                throw new Error('Giải mã MSC1 thất bại. Kiểm tra mật khẩu hoặc mã chia sẻ.');
            }

            return parseMyUrlFromShareCodePlaintext(decryptedText);
        }

        function escapeHtml(value) {
            const d = document.createElement('div');
            d.textContent = value == null ? '' : String(value);
            return d.innerHTML;
        }

        function normalizeEpisode(item, index) {
            const epText = item.ep || item.name || String(index + 1).padStart(2, '0');
            return {
                ep: epText,
                name: item.name || ('Tập ' + epText),
                watchUrl: item.watchUrl || '',
                videoUrl: item.videoUrl || item.urlVideo || item.url || '',
                subtitleUrl: item.subtitleUrl || item.subUrl || item.urlSub || null
            };
        }

        const LOAD_DATA_MESSAGE = 'Đang lấy dữ liệu...';
        const REFRESH_DATA_MESSAGE = 'Đang kiểm tra / refresh dữ liệu phim...';
        const LOAD_DATA_FAILED_MESSAGE = 'Lấy dữ liệu thất bại';
        const LOAD_DATA_NOTE = 'Thời gian lấy dữ liệu có thể mất vài phút tuỳ thuộc vào tốc độ mạng của bạn, Nếu gặp lỗi hãy thử bấm lấy dữ liệu lần nữa.';
        const CLIENT_FETCH_TIMEOUT_MS = 900000;
        const REFRESH_POLL_INTERVAL_MS = 4000;
        const REFRESH_POLL_MAX_MS = 900000;

        function mapWatchServerResponse(data) {
            if (!data || typeof data !== 'object' || data.success === false) {
                throw new Error(LOAD_DATA_FAILED_MESSAGE);
            }

            return data;
        }

        function normalizeApiData(data) {
            const mapped = mapWatchServerResponse(data);

            let episodes = [];
            if (Array.isArray(mapped.episodes)) {
                episodes = mapped.episodes;
            } else if (mapped.episode) {
                episodes = [mapped.episode];
            } else if (mapped.videoUrl) {
                episodes = [{
                    ep: '01',
                    name: 'Tập 01',
                    videoUrl: mapped.videoUrl,
                    subtitleUrl: mapped.subtitleUrl || null,
                    watchUrl: mapped.watchUrl || ''
                }];
            }

            episodes = episodes.map(normalizeEpisode).filter(function(ep) {
                return !!ep.videoUrl;
            });

            if (!episodes.length) {
                throw new Error(LOAD_DATA_FAILED_MESSAGE);
            }

            return episodes;
        }

        function buildProtectedWatchRequestUrl(myUrl, forceRefresh) {
            const base = API_BASE.replace(/\/+$/, '');
            if (!base) {
                throw new Error('Chưa cấu hình API server.');
            }

            let requestUrl = base + '?data=' + encodeURIComponent(myUrl);
            if (forceRefresh) {
                requestUrl += '&forceRefresh=1';
            }

            return requestUrl;
        }

        function getClientDeviceHeaders() {
            return {
                Accept: 'application/json',
                'X-Client-Platform': navigator.platform || '',
                'X-Client-Max-Touch-Points': String(navigator.maxTouchPoints || 0),
                'X-Client-Has-Touch': ('ontouchstart' in window) ? '1' : '0',
                'X-Client-Pointer-Coarse': window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? '1' : '0',
                'X-Client-Hover-None': window.matchMedia && window.matchMedia('(hover: none)').matches ? '1' : '0',
                'X-Client-Screen': [
                    window.screen && window.screen.width,
                    window.screen && window.screen.height,
                    window.devicePixelRatio || 1
                ].join('x')
            };
        }

        async function fetchWithTimeout(url, options, timeoutMs) {
            const controller = new AbortController();
            const timeoutId = setTimeout(function() {
                controller.abort();
            }, timeoutMs);

            try {
                return await fetch(url, {
                    ...(options || {}),
                    signal: controller.signal
                });
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function sleep(ms) {
            return new Promise(function(resolve) {
                setTimeout(resolve, ms);
            });
        }

        async function fetchWatchDataWithRetry(apiUrl) {
            const startedAt = Date.now();

            while (true) {
                const res = await fetchWithTimeout(apiUrl, {
                    method: 'GET',
                    headers: getClientDeviceHeaders()
                }, CLIENT_FETCH_TIMEOUT_MS);

                let data;
                try {
                    data = await res.json();
                } catch (parseError) {
                    throw new Error(LOAD_DATA_FAILED_MESSAGE);
                }

                if (res.ok) {
                    return data;
                }

                if (
                    res.status === 202 &&
                    data &&
                    (data.errorCode === 'DATA_REFRESHING' || data.errorCode === 'DATA_PENDING')
                ) {
                    if (Date.now() - startedAt > REFRESH_POLL_MAX_MS) {
                        throw new Error(LOAD_DATA_FAILED_MESSAGE);
                    }

                    setStatus('loading', REFRESH_DATA_MESSAGE);
                    showPlayerLoading(REFRESH_DATA_MESSAGE, 0);
                    await sleep(REFRESH_POLL_INTERVAL_MS);
                    continue;
                }

                throw new Error(LOAD_DATA_FAILED_MESSAGE);
            }
        }

        async function loadMovieData(options) {
            const opts = options || {};
            const encryptedText = document.getElementById('encryptedInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('btnLoad');
            const reloadBtn = document.getElementById('btn-reload');

            try {
                btn.disabled = true;
                if (reloadBtn) reloadBtn.disabled = true;

                if (!opts.skipLocalCache && restoreSessionIfAvailable({ requireCurrentKey: true })) {
                    return;
                }

                setStatus('loading', LOAD_DATA_MESSAGE);
                if (opts.forceRefresh) {
                    showPlayerLoading(LOAD_DATA_MESSAGE, 0);
                }

                const myUrl = await resolveProtectedWatchUrl(encryptedText, password);

                const apiUrl = buildProtectedWatchRequestUrl(myUrl, opts.forceRefresh);
                const data = await fetchWatchDataWithRetry(apiUrl);

                const episodes = normalizeApiData(data);
                currentSourceType = data.type || '';
                currentMovieTitle = (data.protectedPayload && (data.protectedPayload.Title || data.protectedPayload.title)) ||
                    data.title ||
                    data.name ||
                    currentMovieTitle ||
                    'Phim đã lưu';
                const preserveIndex = Number.isInteger(opts.preserveEpisodeIndex)
                    ? opts.preserveEpisodeIndex
                    : 0;
                const preserveTime = Number(opts.preserveCurrentTime) > 0
                    ? Number(opts.preserveCurrentTime)
                    : 0;
                const nextIndex = Math.min(Math.max(preserveIndex, 0), episodes.length - 1);

                episodesList = episodes;
                currentEpisodeIndex = nextIndex;
                saveSessionState({
                    currentTime: preserveTime,
                    currentEpisodeIndex: nextIndex
                });
                renderEpisodes(episodes, nextIndex, preserveTime);
                enterPlayerMode();
                hidePlayerLoading();
            } catch (err) {
                hidePlayerLoading();
                setStatus('error', LOAD_DATA_FAILED_MESSAGE);
            } finally {
                btn.disabled = false;
                if (reloadBtn) reloadBtn.disabled = false;
            }
        }

        function enterPlayerMode() {
            document.body.classList.add('player-mode');
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('movie-box').style.display = 'flex';
            document.getElementById('movie-box').classList.add('show-player');
        }

        function exitPlayerMode() {
            const player = document.getElementById('vidPlayer');
            if (player) player.pause();
            hidePlayerLoading();
            clearSessionState();
            episodesList = [];
            currentEpisodeIndex = 0;
            currentMovieTitle = '';
            currentSourceType = '';
            document.body.classList.remove('player-mode');
            document.getElementById('movie-box').style.display = 'none';
            document.getElementById('movie-box').classList.remove('show-player');
            document.getElementById('setup-box').style.display = '';
            hideStatus();
            renderHistoryLists();
        }

        function setupCustomPlayer() {
            const movieBox = document.getElementById('movie-box');
            const player = document.getElementById('vidPlayer');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');
            const btnFs = document.getElementById('btn-fs');
            const timeDisplay = document.getElementById('time-display');
            if (!movieBox || !player || playerUiBound) return;
            playerUiBound = true;

            function getFsEl() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }
            function isFullscreen() {
                return getFsEl() === movieBox || movieBox.classList.contains('fs-active');
            }
            function enterFullscreen() {
                if (movieBox.requestFullscreen) {
                    return movieBox.requestFullscreen().catch(function() {
                        movieBox.classList.add('fs-active');
                    });
                }
                if (movieBox.webkitRequestFullscreen) {
                    try { movieBox.webkitRequestFullscreen(); } catch (e) { movieBox.classList.add('fs-active'); }
                    return;
                }
                movieBox.classList.add('fs-active');
            }
            function exitFullscreen() {
                movieBox.classList.remove('fs-active');
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (getFsEl() === movieBox && exit) exit.call(document);
            }
            function updatePlayIcon() {
                btnPlay.textContent = player.paused ? '▶' : '❚❚';
                btnPlay.setAttribute('aria-label', player.paused ? 'Phát' : 'Tạm');
            }
            function updateTimeUi() {
                const cur = player.currentTime || 0;
                const dur = player.duration || 0;
                timeDisplay.textContent = formatTime(cur) + ' / ' + formatTime(dur);
                if (!isSeeking && dur > 0) {
                    progressBar.value = Math.round((cur / dur) * 1000);
                }
            }

            btnPlay.addEventListener('click', function() {
                if (player.paused) safePlay(player); else player.pause();
            });
            player.addEventListener('play', updatePlayIcon);
            player.addEventListener('pause', updatePlayIcon);
            player.addEventListener('loadstart', function() {
                showPlayerLoading('Đang tải phim...');
            });
            player.addEventListener('waiting', function() {
                showStalledLoadingIfNeeded(player);
            });
            player.addEventListener('stalled', function() {
                showStalledLoadingIfNeeded(player);
            });
            player.addEventListener('seeking', function() {
                showPlayerLoading('Đang tua...');
            });
            player.addEventListener('seeked', hidePlayerLoading);
            player.addEventListener('canplay', hidePlayerLoading);
            player.addEventListener('canplaythrough', hidePlayerLoading);
            player.addEventListener('playing', hidePlayerLoading);
            player.addEventListener('loadeddata', hidePlayerLoading);
            player.addEventListener('timeupdate', updateTimeUi);
            player.addEventListener('timeupdate', function() {
                const now = Date.now();
                if (now - lastSessionSaveAt > 5000) {
                    lastSessionSaveAt = now;
                    saveSessionState();
                }
            });
            player.addEventListener('loadedmetadata', updateTimeUi);
            player.addEventListener('loadedmetadata', hidePlayerLoading);
            player.addEventListener('durationchange', updateTimeUi);
            player.addEventListener('ended', function() {
                hidePlayerLoading();
                updatePlayIcon();
                saveSessionState({ currentTime: 0 });
                playNextEpisode(true);
            });
            player.addEventListener('error', function() {
                if (!player.error) return;

                // 1. Chốt chặn quan trọng nhất: Nếu video đang phát qua HLS (nguồn là blob:),
                // mọi lỗi sẽ do hlsInstance tự xử lý. Thẻ video Native không được phép báo lỗi.
                const currentSrc = player.currentSrc || player.src || '';
                if (currentSrc.startsWith('blob:') || hlsInstance) {
                    return;
                }

                // 2. Bỏ qua lỗi ngắt kết nối chủ động (mã 3) do gọi player.load()
                if (player.error.code === 3) {
                    return;
                }

                // 3. Bỏ qua nếu thẻ video đang rỗng (lỗi ảo lúc dọn rác)
                if (player.error.code === 4 && !currentSrc && !player.querySelector('source')) {
                    return;
                }

                if (isSwitchingEpisode) {
                    return;
                }
                
                hidePlayerLoading();
                showToast('Lỗi thẻ Video (Mã ' + player.error.code + '): Link lỗi hoặc định dạng không hỗ trợ'); 
            });

            progressBar.addEventListener('input', function() {
                isSeeking = true;
                const dur = player.duration;
                if (dur > 0) {
                    const t = (progressBar.value / 1000) * dur;
                    timeDisplay.textContent = formatTime(t) + ' / ' + formatTime(dur);
                }
            });
            progressBar.addEventListener('change', function() {
                const dur = player.duration;
                if (dur > 0) player.currentTime = (progressBar.value / 1000) * dur;
                isSeeking = false;
            });
            progressBar.addEventListener('pointerup', function() { isSeeking = false; });

            btnFs.addEventListener('click', function() {
                if (isFullscreen()) exitFullscreen(); else enterFullscreen();
            });
            function onFsChange() {
                if (!getFsEl()) movieBox.classList.remove('fs-active');
                btnFs.textContent = isFullscreen() ? '⊡' : '⛶';
            }
            document.addEventListener('fullscreenchange', onFsChange);
            document.addEventListener('webkitfullscreenchange', onFsChange);

            player.addEventListener('click', function(e) {
                if (e.target === player) {
                    if (player.paused) safePlay(player); else player.pause();
                }
            });
        }

        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            if (show) {
                overlay.style.display = 'block';
                setTimeout(function() { overlay.classList.add('show'); }, 10);
            } else {
                overlay.classList.remove('show');
                setTimeout(function() { overlay.style.display = 'none'; }, 300);
            }
        }

        function updateNextEpButton() {
            const btn = document.getElementById('fab-next-ep');
            if (!btn) return;
            btn.disabled = episodesList.length === 0 || currentEpisodeIndex >= episodesList.length - 1;
        }

        function playEpisodeByIndex(index, fromAuto, startTime) {
            if (index < 0 || index >= episodesList.length) return false;
            currentEpisodeIndex = index;
            document.querySelectorAll('.ep-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            const activeBtn = document.querySelector('.ep-btn[data-index="' + index + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            saveSessionState({ currentTime: startTime || 0 });
            playVideo(episodesList[index], startTime || 0);
            updateNextEpButton();
            if (!fromAuto) togglePopup(false);
            return true;
        }

        function playNextEpisode(fromAuto) {
            if (currentEpisodeIndex + 1 >= episodesList.length) {
                if (!fromAuto) showToast('Đã là tập cuối');
                return false;
            }
            return playEpisodeByIndex(currentEpisodeIndex + 1, fromAuto);
        }

        function renderEpisodes(episodes, initialIndex, initialTime) {
            episodesList = episodes;
            currentEpisodeIndex = Number.isInteger(initialIndex) ? initialIndex : 0;
            const listContainer = document.getElementById('epList');
            listContainer.innerHTML = '';
            episodes.forEach(function(ep, index) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.dataset.index = String(index);
                btn.textContent = ep.name || ('Tập ' + ep.ep);
                btn.onclick = function() {
                    playEpisodeByIndex(index, false);
                };
                listContainer.appendChild(btn);
            });
            if (episodes.length) playEpisodeByIndex(currentEpisodeIndex, true, initialTime || 0);
            else updateNextEpButton();
        }

        function cleanupCurrentMedia() {
            playbackToken++;
            const player = document.getElementById('vidPlayer');
            hidePlayerLoading();
            player.pause();

            let wasHls = false;
            if (hlsInstance) {
                wasHls = true;
                try {
                    hlsInstance.stopLoad();
                    hlsInstance.detachMedia();
                    hlsInstance.destroy();
                } catch (error) {}
                hlsInstance = null;
            }
            
            player.removeAttribute('src');
            player.innerHTML = ''; 
            
            // CHỈ gọi load() nếu trước đó dùng file MP4 thuần.
            // Nếu dùng HLS, destroy() ở trên đã dọn sạch. Gọi load() sẽ gây lỗi "chết luồng" tập tiếp theo.
            if (!wasHls) {
                player.load(); 
            }

            cleanupSubtitleSession();
        }

        function decodeBase64ToUtf8(base64Text) {
            const binaryStr = atob(base64Text);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        function decodeSubtitleToVtt(subtitleUrl) {
            if (!subtitleUrl) {
                return null;
            }

            const raw = String(subtitleUrl).trim();
            if (!raw) {
                return null;
            }

            if (/^WEBVTT/i.test(raw) || raw.includes('-->')) {
                return raw;
            }

            try {
                const decoded = decodeBase64ToUtf8(raw);
                if (decoded && (/^WEBVTT/i.test(decoded.trim()) || decoded.includes('-->'))) {
                    return decoded;
                }
            } catch (error) {}

            return null;
        }

        function parseVttTimestamp(value) {
            const parts = String(value || '').trim().split(':');

            if (parts.length === 3) {
                return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + parseFloat(parts[2]);
            }

            if (parts.length === 2) {
                return Number(parts[0]) * 60 + parseFloat(parts[1]);
            }

            return parseFloat(parts[0]) || 0;
        }

        function stripVttTags(text) {
            return String(text || '')
                .replace(/<[^>]+>/g, '')
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>')
                .trim();
        }

        function parseVttToCues(vttText) {
            if (!vttText) {
                return [];
            }

            const normalized = String(vttText).replace(/\uFEFF/g, '').replace(/\r/g, '');
            if (!/^WEBVTT/i.test(normalized.trim())) {
                return [];
            }

            const blocks = normalized.split(/\n\n+/);
            const cues = [];

            blocks.forEach(function(block) {
                const lines = block.split('\n').map(function(line) {
                    return line.trim();
                }).filter(Boolean);

                if (!lines.length) {
                    return;
                }

                let timingIndex = 0;
                if (!lines[0].includes('-->') && lines.length > 1) {
                    timingIndex = 1;
                }

                const timingLine = lines[timingIndex];
                if (!timingLine || !timingLine.includes('-->')) {
                    return;
                }

                const timingParts = timingLine.split('-->');
                const start = parseVttTimestamp(timingParts[0]);
                const end = parseVttTimestamp(String(timingParts[1] || '').trim().split(/\s+/)[0]);
                const text = stripVttTags(lines.slice(timingIndex + 1).join('\n'));

                if (text && end > start) {
                    cues.push({ start: start, end: end, text: text });
                }
            });

            return cues.sort(function(left, right) {
                return left.start - right.start;
            });
        }

        function clearSubtitleSyncListeners() {
            const player = document.getElementById('vidPlayer');

            if (player && subtitleTimeUpdateHandler) {
                player.removeEventListener('timeupdate', subtitleTimeUpdateHandler);
            }

            if (player && subtitleSeekedHandler) {
                player.removeEventListener('seeked', subtitleSeekedHandler);
            }

            subtitleTimeUpdateHandler = null;
            subtitleSeekedHandler = null;
        }

        function cleanupSubtitleSession() {
            clearSubtitleSyncListeners();
            subtitleCues = [];
            subtitleSyncToken++;
        }

        function renderSubtitleAtTime(currentTime, token) {
            const customSub = document.getElementById('custom-sub');
            if (!customSub || token !== subtitleSyncToken) {
                return;
            }

            if (!subtitleCues.length) {
                customSub.innerHTML = '';
                customSub.style.display = 'none';
                return;
            }

            let activeCue = null;
            for (let i = 0; i < subtitleCues.length; i++) {
                const cue = subtitleCues[i];
                if (currentTime >= cue.start && currentTime < cue.end) {
                    activeCue = cue;
                    break;
                }
            }

            if (activeCue) {
                customSub.innerHTML = activeCue.text.replace(/\n/g, '<br>');
                customSub.style.display = 'block';
            } else {
                customSub.innerHTML = '';
                customSub.style.display = 'none';
            }
        }

        function prepareSubtitleSession(subtitleUrl, token) {
            subtitleCues = [];
            subtitleSyncToken = token;

            const vttText = decodeSubtitleToVtt(subtitleUrl);
            if (!vttText) {
                return false;
            }

            if (!/^WEBVTT/i.test(vttText.trim())) {
                console.warn('Subtitle data is missing WEBVTT header');
                return false;
            }

            subtitleCues = parseVttToCues(vttText);
            if (!subtitleCues.length) {
                console.warn('Subtitle VTT parsed with zero cues');
                return false;
            }

            return true;
        }

        function startSubtitleSync(player, token) {
            if (!subtitleCues.length || token !== subtitleSyncToken) {
                return;
            }

            clearSubtitleSyncListeners();

            function syncSubtitleNow() {
                if (token !== subtitleSyncToken) {
                    return;
                }
                renderSubtitleAtTime(player.currentTime || 0, token);
            }

            subtitleTimeUpdateHandler = syncSubtitleNow;
            subtitleSeekedHandler = syncSubtitleNow;
            player.addEventListener('timeupdate', subtitleTimeUpdateHandler);
            player.addEventListener('seeked', subtitleSeekedHandler);
            syncSubtitleNow();
        }

        function isDramafrenProxyUrl(url) {
            if (!url) return false;

            try {
                const parsedUrl = new URL(url);
                return parsedUrl.hostname.toLowerCase().endsWith('.dramafren.org') &&
                    parsedUrl.pathname.includes('/proxy') &&
                    parsedUrl.searchParams.has('url');
            } catch (error) {
                return false;
            }
        }

        function isDramaboxCdnUrl(url) {
            if (!url) return false;

            try {
                const hostname = new URL(url).hostname.toLowerCase();
                return hostname === 'dramabox.dramabos.online' ||
                    hostname.endsWith('.dramabos.online') ||
                    hostname === 'dramaboxdb.com' ||
                    hostname.endsWith('.dramaboxdb.com');
            } catch (error) {
                return false;
            }
        }

        function needsLocalMediaProxy(url, sourceType) {
            const originUrl = unwrapDramafrenProxyUrl(url);
            if (!originUrl) return false;
            return sourceType === 'dramabox' || isDramaboxCdnUrl(originUrl);
        }

        function unwrapDramafrenProxyUrl(url) {
            if (!isDramafrenProxyUrl(url)) {
                return url;
            }

            try {
                return new URL(url).searchParams.get('url') || url;
            } catch (error) {
                return url;
            }
        }

        function needsMediaProxy(url, sourceType) {
            const originUrl = unwrapDramafrenProxyUrl(url);
            if (!originUrl) return false;
            if (needsLocalMediaProxy(originUrl, sourceType)) return false;
            if (sourceType === 'shortmax' || sourceType === 'dramawave') return true;
            if (/mydramawave\.com/i.test(originUrl)) return true;
            return /\.m3u8(\?|$)/i.test(originUrl) && /shorttv\.live/i.test(originUrl);
        }

        function resolvePlaybackUrl(videoUrl, sourceType) {
            if (!videoUrl) {
                return '';
            }

            const originUrl = unwrapDramafrenProxyUrl(videoUrl);

            if (needsLocalMediaProxy(originUrl, sourceType)) {
                return API_BASE + '/media?url=' + encodeURIComponent(originUrl);
            }

            if (!needsMediaProxy(originUrl, sourceType)) {
                return originUrl;
            }

            if (!hlsProxyBaseUrl) {
                showToast('Chưa cấu hình media proxy');
                return null;
            }

            return hlsProxyBaseUrl + encodeURIComponent(originUrl);
        }

        async function loadClientConfig() {
            try {
                const res = await fetch(API_BASE.replace(/\/+$/, '') + '/config');
                const data = await res.json();
                if (data && data.success) {
                    hlsProxyBaseUrl = data.hlsProxyBaseUrl || '';
                }
            } catch (error) {}
        }

        function getVideoType(videoUrl) {
            let checkUrl = videoUrl;

            try {
                if (String(videoUrl || '').includes('/media?url=')) {
                    const parsed = new URL(videoUrl, window.location.origin);
                    const innerUrl = parsed.searchParams.get('url');
                    if (innerUrl) {
                        checkUrl = innerUrl;
                    }
                }
            } catch (error) {}

            if (/\.m3u8(\?|$)/i.test(checkUrl)) return 'application/x-mpegURL';
            if (/\.mp4(\?|$)/i.test(checkUrl) || checkUrl.includes('mime_type=video_mp4')) return 'video/mp4';
            return 'video/mp4';
        }

        function isCurrentPlayback(token) {
            return token === playbackToken;
        }

        function safePlay(player, options) {
            const opts = options || {};
            const token = opts.playbackToken;

            if (token != null && !isCurrentPlayback(token)) {
                return;
            }

            const playPromise = player.play();

            if (!playPromise || typeof playPromise.catch !== 'function') {
                return;
            }

            playPromise.catch(function(error) {
                if (token != null && !isCurrentPlayback(token)) {
                    return;
                }

                if (isSwitchingEpisode) {
                    return;
                }

                if (error && (error.name === 'AbortError' || error.name === 'NotSupportedError')) {
                    return;
                }

                hidePlayerLoading();

                if (error && error.name === 'NotAllowedError') {
                    if (opts.showAutoplayToast !== false) {
                        showToast('Bấm nút phát nếu trình duyệt chặn autoplay');
                    }
                    return;
                }

                showToast('Lỗi lệnh Play: Không phát được video này');
            });
        }

        function playWhenSourceReady(player, token) {
            function onReady() {
                player.removeEventListener('loadedmetadata', onReady);
                player.removeEventListener('canplay', onReady);

                if (!isCurrentPlayback(token)) {
                    return;
                }

                safePlay(player, { playbackToken: token });
            }

            if (player.readyState >= 1) {
                safePlay(player, { playbackToken: token });
                return;
            }

            player.addEventListener('loadedmetadata', onReady);
            player.addEventListener('canplay', onReady);
        }

        function attachVideoSource(player, videoUrl, token) {
            const type = getVideoType(videoUrl);
            if (type === 'application/x-mpegURL') {
                if (window.Hls && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.on(Hls.Events.MANIFEST_LOADING, function() {
                        if (!isCurrentPlayback(token)) {
                            return;
                        }
                        showPlayerLoading('Đang tải danh sách phát...');
                    });
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                        if (!isCurrentPlayback(token)) {
                            return;
                        }
                        showPlayerLoading('Đang chuẩn bị phát...', 0);
                        safePlay(player, { playbackToken: token });
                    });
                    hlsInstance.on(Hls.Events.FRAG_BUFFERED, function() {
                        if (!isCurrentPlayback(token)) {
                            return;
                        }
                        hidePlayerLoading();
                    });
                    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                        if (!isCurrentPlayback(token)) {
                            return;
                        }
                        if (data && data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hlsInstance.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hlsInstance.recoverMediaError();
                                    break;
                                default:
                                    hidePlayerLoading();
                                    // Đổi text để nhận diện
                                    showToast('Lỗi luồng HLS: Không phát được video'); 
                                    hlsInstance.destroy();
                                    break;
                            }
                        }
                    });
                    hlsInstance.on(Hls.Events.MEDIA_ATTACHED, function() {
                        if (!isCurrentPlayback(token)) {
                            return;
                        }
                        hlsInstance.loadSource(videoUrl);
                    });
                    hlsInstance.attachMedia(player);
                    return 'hls';
                }
                if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = videoUrl;
                    return 'native';
                }
                
            }

            const source = document.createElement('source');
            source.src = videoUrl;
            source.type = type;
            player.appendChild(source);
            return 'source';
        }

        function playVideo(ep, startTime) {
            const player = document.getElementById('vidPlayer');
            const customSub = document.getElementById('custom-sub');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');
            const title = document.getElementById('episode-title');
            const timeDisplay = document.getElementById('time-display');
            isSwitchingEpisode = true;
            cleanupCurrentMedia();
            // Token chỉ tăng trong cleanupCurrentMedia(); không ++ thêm ở đây.
            const token = playbackToken;
            customSub.innerHTML = '';
            customSub.style.display = 'none';
            progressBar.value = 0;
            btnPlay.textContent = '▶';
            if (timeDisplay) {
                timeDisplay.textContent = '0:00 / 0:00';
            }
            title.textContent = ep.name || ('Tập ' + ep.ep);
            showPlayerLoading('Đang tải ' + (ep.name || ('Tập ' + ep.ep)) + '...', 0);

            const playbackUrl = resolvePlaybackUrl(ep.videoUrl, currentSourceType);
            if (!playbackUrl) {
                hidePlayerLoading();
                isSwitchingEpisode = false;
                return;
            }

            const hasSubtitle = prepareSubtitleSession(ep.subtitleUrl, token);
            const sourceMode = attachVideoSource(player, playbackUrl, token);

            if (hasSubtitle) {
                startSubtitleSync(player, token);
            }

            if (startTime > 0) {
                player.addEventListener('loadedmetadata', function restoreTimeOnce() {
                    player.removeEventListener('loadedmetadata', restoreTimeOnce);
                    if (!isCurrentPlayback(token)) {
                        return;
                    }
                    if (player.duration && startTime < player.duration - 2) {
                        player.currentTime = startTime;
                    }
                    renderSubtitleAtTime(player.currentTime || 0, token);
                });
            }

            if (sourceMode === 'hls') {
                requestAnimationFrame(function() {
                    if (isCurrentPlayback(token)) {
                        isSwitchingEpisode = false;
                    }
                });
                return;
            }

            player.load();
            playWhenSourceReady(player, token);
            requestAnimationFrame(function() {
                if (isCurrentPlayback(token)) {
                    isSwitchingEpisode = false;
                }
            });
        }

        function showToast(message) {
            let el = document.getElementById('ep-toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'ep-toast';
                el.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s';
                document.body.appendChild(el);
            }
            el.textContent = message;
            el.style.opacity = '1';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.style.opacity = '0'; }, 2200);
        }

        function restoreSessionIfAvailable(options) {
            const state = readSessionState();
            if (!state || !Array.isArray(state.episodes) || !state.episodes.length) {
                return false;
            }

            if (options && options.requireCurrentKey && state.cacheKey !== getCurrentSessionKey()) {
                return false;
            }

            const episodes = state.episodes.map(normalizeEpisode).filter(function(ep) {
                return !!ep.videoUrl;
            });
            if (!episodes.length) {
                clearSessionState();
                return false;
            }

            const index = Number.isInteger(state.currentEpisodeIndex)
                ? Math.min(Math.max(state.currentEpisodeIndex, 0), episodes.length - 1)
                : 0;
            const time = Number(state.currentTime) > 0 ? Number(state.currentTime) : 0;

            const encryptedInput = document.getElementById('encryptedInput');
            const passwordInput = document.getElementById('passwordInput');
            if (encryptedInput && state.encryptedText) encryptedInput.value = state.encryptedText;
            if (passwordInput && state.password != null) passwordInput.value = state.password;
            currentMovieTitle = getHistoryTitle(state);
            currentSourceType = state.sourceType || '';
            renderEpisodes(episodes, index, time);
            enterPlayerMode();
            return true;
        }

        function toggleRefreshConfirm(show) {
            const overlay = document.getElementById('confirm-overlay');
            if (!overlay) return;

            overlay.classList.toggle('show', Boolean(show));
            overlay.setAttribute('aria-hidden', show ? 'false' : 'true');
        }

        function requestForceRefresh() {
            pendingRefreshRequest = {
                cacheKey: getCurrentSessionKey()
            };
            toggleRefreshConfirm(true);
        }

        function confirmForceRefresh() {
            if (!pendingRefreshRequest) {
                toggleRefreshConfirm(false);
                return;
            }

            const request = pendingRefreshRequest;
            pendingRefreshRequest = null;
            toggleRefreshConfirm(false);
            removeHistoryItem(request.cacheKey);
            clearSessionState();
            cleanupCurrentMedia();
            episodesList = [];
            currentEpisodeIndex = 0;
            currentMovieTitle = '';
            document.body.classList.remove('player-mode');
            document.getElementById('movie-box').style.display = 'none';
            document.getElementById('movie-box').classList.remove('show-player');
            document.getElementById('setup-box').style.display = '';

            setTimeout(function() {
                loadMovieData({
                    skipLocalCache: true,
                    forceRefresh: true
                });
            }, 0);
        }

        document.getElementById('btnLoad').addEventListener('click', loadMovieData);
        document.getElementById('btn-back').addEventListener('click', exitPlayerMode);
        document.getElementById('btn-reload').addEventListener('click', requestForceRefresh);
        document.getElementById('confirm-cancel').addEventListener('click', function() {
            pendingRefreshRequest = null;
            toggleRefreshConfirm(false);
        });
        document.getElementById('confirm-ok').addEventListener('click', confirmForceRefresh);
        document.getElementById('confirm-overlay').addEventListener('click', function(e) {
            if (e.target === e.currentTarget) {
                pendingRefreshRequest = null;
                toggleRefreshConfirm(false);
            }
        });
        document.getElementById('btn-history').addEventListener('click', function() {
            renderHistoryLists();
            toggleHistoryPopup(true);
        });
        document.getElementById('history-close').addEventListener('click', function() {
            toggleHistoryPopup(false);
        });
        document.getElementById('history-overlay').addEventListener('click', function(e) {
            if (e.target === e.currentTarget) {
                toggleHistoryPopup(false);
            }
        });
        document.getElementById('fab-episodes').addEventListener('click', function() {
            togglePopup(true);
        });
        document.getElementById('fab-history-player').addEventListener('click', function() {
            renderHistoryLists();
            toggleHistoryPopup(true);
        });
        document.getElementById('fab-next-ep').addEventListener('click', function() {
            playNextEpisode(false);
        });
        document.getElementById('encryptedInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadMovieData();
        });
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadMovieData();
        });
        window.addEventListener('pagehide', function() {
            saveSessionState();
        });

        function hydrateInputFromUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');

            if (!data) {
                return false;
            }

            const input = document.getElementById('encryptedInput');
            if (input) {
                input.value = data.trim();
            }

            return true;
        }

        window.addEventListener('DOMContentLoaded', async function() {
            await loadClientConfig();

            const hasDataParam = hydrateInputFromUrlParams();

            setupCustomPlayer();
            renderHistoryLists();

            if (hasDataParam) {
                if (restoreSessionIfAvailable({ requireCurrentKey: true })) {
                    return;
                }
                loadMovieData();
                return;
            }

            restoreSessionIfAvailable();
        });
    </script>
</body>
