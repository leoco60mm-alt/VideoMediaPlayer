<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Phát Video - Auto Load & Blob Subtitle</title>
    <style>
        body {
            background-color: #000; color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #block-screen { display: none; text-align: center; margin-top: 20vh; padding: 30px; }
        #block-screen h2 { color: #e50914; }

        #setup-box { display: none !important; }
        #base64Input { display: none; }

        /* --- MÀN HÌNH XEM PHIM & TRÌNH PHÁT TÙY CHỈNH --- */
        #movie-box {
            display: none;
            width: 100vw; height: 100vh; height: 100dvh;
            background: #000; position: relative;
        }
        #player-shell {
            position: relative; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            background: #000;
        }
        #vidPlayer {
            width: 100%; flex: 1; min-height: 0;
            max-height: calc(100vh - 72px); max-height: calc(100dvh - 72px);
            object-fit: contain; background: #000; outline: none;
        }
        video::cue { color: transparent; background: transparent; }

        #custom-sub {
            position: absolute; top: 66.67%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; text-align: center; font-size: 26px; font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -2px -2px 4px rgba(0,0,0,0.9);
            pointer-events: none; z-index: 15; display: none;
        }

        #video-watermark {
            position: absolute; top: 26%; left: 50%;
            transform: translate(-50%, -50%) rotate(-24deg);
            width: 90%; text-align: center;
            font-size: clamp(14px, 3.5vw, 22px); font-weight: 600;
            color: #fff; opacity: 0.5;
            pointer-events: none; z-index: 12;
            user-select: none; white-space: nowrap;
        }

        #player-controls {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
            padding: 10px 14px 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
            box-sizing: border-box;
        }
        #progress-bar {
            width: 100%; height: 6px; margin: 0 0 10px; cursor: pointer;
            -webkit-appearance: none; appearance: none;
            background: rgba(255, 255, 255, 0.25); border-radius: 3px;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #e50914; cursor: pointer;
        }
        #progress-bar::-moz-range-thumb {
            width: 14px; height: 14px; border: none; border-radius: 50%;
            background: #e50914; cursor: pointer;
        }
        .controls-row {
            display: flex; align-items: center; gap: 12px;
        }
        .ctrl-btn {
            background: transparent; border: none; color: #fff;
            font-size: 22px; cursor: pointer; padding: 4px 8px;
            line-height: 1; flex-shrink: 0;
        }
        #time-display {
            flex: 1; font-size: 13px; color: #ddd; font-variant-numeric: tabular-nums;
        }

        #movie-box:fullscreen,
        #movie-box:-webkit-full-screen,
        #movie-box.fs-active {
            width: 100vw !important; height: 100vh !important; height: 100dvh !important;
        }
        #movie-box:fullscreen #vidPlayer,
        #movie-box:-webkit-full-screen #vidPlayer,
        #movie-box.fs-active #vidPlayer {
            max-height: calc(100vh - 72px); max-height: calc(100dvh - 72px);
        }
        #movie-box.fs-active {
            position: fixed !important; top: 0; left: 0; z-index: 9999;
        }

        /* --- NÚT FAB & POPUP --- */
        #fab-episodes {
            display: none; position: fixed;
            top: 50%; right: 0; transform: translateY(-50%);
            background-color: rgba(229, 9, 20, 0.45); color: white; border: none;
            border-radius: 30px 0 0 30px;
            padding: 12px 16px 12px 20px; font-size: 15px; font-weight: bold;
            box-shadow: -2px 0 12px rgba(0, 0, 0, 0.25); z-index: 90; cursor: pointer;
            align-items: center; gap: 8px;
            opacity: 0.55;
            transition: opacity 0.2s ease, background-color 0.2s ease;
        }
        #fab-episodes:hover,
        #fab-episodes:focus {
            opacity: 0.95;
            background-color: rgba(229, 9, 20, 0.9);
        }

        #popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            z-index: 100; display: none; opacity: 0; transition: opacity 0.3s ease;
        }

        #popup-content {
            position: absolute; bottom: -100%; left: 0; width: 100%;
            background: #1c1c1c; border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 20px; box-sizing: border-box; max-height: 70vh;
            display: flex; flex-direction: column; transition: bottom 0.3s ease;
        }
        #popup-overlay.show { display: block; opacity: 1; }
        #popup-overlay.show #popup-content { bottom: 0; }
        .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .popup-header h3 { margin: 0; font-size: 18px; }
        .close-btn { background: transparent; border: none; color: #fff; font-size: 24px; font-weight: bold; cursor: pointer; padding: 0; }
        .list-container { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-bottom: 20px; }
        .ep-btn { background: #2a2a2a; color: #fff; border: none; padding: 15px; border-radius: 10px; cursor: pointer; font-size: 15px; text-align: left; font-weight: bold; }
        .ep-btn.active { background: #e50914; color: white; }
    </style>
</head>

        let isSeeking = false;

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function setupCustomPlayer() {
            const movieBox = document.getElementById('movie-box');
            const player = document.getElementById('vidPlayer');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');
            const btnFs = document.getElementById('btn-fs');
            const timeDisplay = document.getElementById('time-display');
            if (!movieBox || !player || playerUiBound) return;
            playerUiBound = true;

            function getFsEl() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }
            function isFullscreen() {
                return getFsEl() === movieBox || movieBox.classList.contains('fs-active');
            }
            function enterFullscreen() {
                if (movieBox.requestFullscreen) {
                    return movieBox.requestFullscreen().catch(function() {
                        movieBox.classList.add('fs-active');
                    });
                }
                if (movieBox.webkitRequestFullscreen) {
                    try { movieBox.webkitRequestFullscreen(); } catch (e) { movieBox.classList.add('fs-active'); }
                    return;
                }
                movieBox.classList.add('fs-active');
            }
            function exitFullscreen() {
                movieBox.classList.remove('fs-active');
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (getFsEl() === movieBox && exit) exit.call(document);
            }
            function updatePlayIcon() {
                btnPlay.textContent = player.paused ? '▶' : '❚❚';
                btnPlay.setAttribute('aria-label', player.paused ? 'Phát' : 'Tạm');
            }
            function updateTimeUi() {
                const cur = player.currentTime || 0;
                const dur = player.duration || 0;
                timeDisplay.textContent = formatTime(cur) + ' / ' + formatTime(dur);
                if (!isSeeking && dur > 0) {
                    progressBar.value = Math.round((cur / dur) * 1000);
                }
            }

            btnPlay.addEventListener('click', function() {
                if (player.paused) player.play(); else player.pause();
            });
            player.addEventListener('play', updatePlayIcon);
            player.addEventListener('pause', updatePlayIcon);
            player.addEventListener('timeupdate', updateTimeUi);
            player.addEventListener('loadedmetadata', updateTimeUi);
            player.addEventListener('durationchange', updateTimeUi);
            player.addEventListener('ended', updatePlayIcon);

            progressBar.addEventListener('input', function() {
                isSeeking = true;
                const dur = player.duration;
                if (dur > 0) {
                    const t = (progressBar.value / 1000) * dur;
                    timeDisplay.textContent = formatTime(t) + ' / ' + formatTime(dur);
                }
            });
            progressBar.addEventListener('change', function() {
                const dur = player.duration;
                if (dur > 0) player.currentTime = (progressBar.value / 1000) * dur;
                isSeeking = false;
            });
            progressBar.addEventListener('pointerup', function() { isSeeking = false; });

            btnFs.addEventListener('click', function() {
                if (isFullscreen()) exitFullscreen(); else enterFullscreen();
            });
            function onFsChange() {
                if (!getFsEl()) movieBox.classList.remove('fs-active');
                btnFs.textContent = isFullscreen() ? '⊡' : '⛶';
            }
            document.addEventListener('fullscreenchange', onFsChange);
            document.addEventListener('webkitfullscreenchange', onFsChange);

            player.addEventListener('click', function(e) {
                if (e.target === player) {
                    if (player.paused) player.play(); else player.pause();
                }
            });
        }

        function triggerBlock() {
            if (isBlocked) return;
            isBlocked = true;
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('movie-box').style.display = 'none';
            document.getElementById('fab-episodes').style.display = 'none';
            document.getElementById('block-screen').style.display = 'block';
            const p = document.getElementById('vidPlayer');
            if (p) { p.pause(); p.removeAttribute('src'); p.load(); }
        }

        function detectDevToolsAndDesktop() {
            if (!ENABLE_BLOCKER) return;
            const isEmulatorSize = (window.outerWidth > 0 && Math.abs(window.outerWidth - window.innerWidth) > 150);
            const isDesktopPlatform = /Win32|Win64|MacIntel|Linux x86_64/.test(navigator.platform);
            if (isEmulatorSize || isDesktopPlatform) triggerBlock();
        }

        if (ENABLE_BLOCKER) {
            detectDevToolsAndDesktop();
            window.addEventListener('resize', detectDevToolsAndDesktop);
        }

        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            if (show) {
                overlay.style.display = 'block';
                setTimeout(() => overlay.classList.add('show'), 10);
            } else {
                overlay.classList.remove('show');
                setTimeout(() => overlay.style.display = 'none', 300);
            }
        }
        
        function processMovieData(base64Data) {
            if (isBlocked) return;
            if (!base64Data) return alert("Không có dữ liệu Base64!");

            try {
                const decodedStr = decodeURIComponent(escape(atob(base64Data)));
                let episodes = JSON.parse(decodedStr);
                if (!Array.isArray(episodes)) episodes = [episodes];

                document.getElementById('setup-box').style.display = 'none';
                document.getElementById('movie-box').style.display = 'flex'; 
                document.getElementById('fab-episodes').style.display = 'flex';

                renderEpisodes(episodes);
            } catch (err) {
                console.error(err);
                alert("Lỗi: Mã Base64 không hợp lệ hoặc sai cấu trúc JSON!");
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setupCustomPlayer();
            const fixedData = document.getElementById('base64Input').value.trim();
            if (fixedData) processMovieData(fixedData);
        });

        function renderEpisodes(episodes) {
            const listContainer = document.getElementById('epList');
            listContainer.innerHTML = ''; 
            episodes.forEach((ep, index) => {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.textContent = ep.name || `Tập ${index + 1}`; 
                
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    playVideo(ep);
                    togglePopup(false); 
                };
                listContainer.appendChild(btn);
            });
            if(listContainer.firstChild) listContainer.firstChild.click();
        }

        // --- 🌟 LOGIC XỬ LÝ VIDEO & BẮT PHỤ ĐỀ BASE64 🌟 ---
        function playVideo(ep) {
            const player = document.getElementById('vidPlayer');
            const customSub = document.getElementById('custom-sub');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');

            player.innerHTML = '';
            customSub.innerHTML = '';
            customSub.style.display = 'none';
            if (progressBar) progressBar.value = 0;
            if (btnPlay) btnPlay.textContent = '▶';

            // Dọn dẹp RAM: Xóa file sub ảo của tập cũ trước khi sang tập mới
            if (currentSubtitleBlobUrl) {
                URL.revokeObjectURL(currentSubtitleBlobUrl);
                currentSubtitleBlobUrl = null;
            }

            const source = document.createElement('source');
            source.src = ep.videoUrl || ep.urlVideo;
            source.type = 'video/mp4';
            player.appendChild(source);

            const subData = ep.subUrl || ep.urlSub;
            
            if (subData) {
                let finalSubLink = subData; // Mặc định giả sử nó là 1 đường link URL

                // THUẬT TOÁN PHÂN LOẠI: URL hay Base64 VTT?
                try {
                    // Cố tình giải mã. Nếu subData là URL ("https://...") nó sẽ văng lỗi ngay lập tức
                    const binaryStr = atob(subData);
                    
                    // Sử dụng TextDecoder để đảm bảo tiếng Việt (UTF-8) không bị lỗi font
                    const bytes = new Uint8Array(binaryStr.length);
                    for (let i = 0; i < binaryStr.length; i++) {
                        bytes[i] = binaryStr.charCodeAt(i);
                    }
                    const decodedVttText = new TextDecoder('utf-8').decode(bytes);

                    // Nếu mã hóa thành công, tạo một File VTT ảo trên RAM (Blob)
                    const blob = new Blob([decodedVttText], { type: 'text/vtt;charset=utf-8' });
                    finalSubLink = URL.createObjectURL(blob);
                    
                    // Lưu lại URL ảo này để dọn dẹp sau
                    currentSubtitleBlobUrl = finalSubLink;

                } catch (error) {
                    // Nếu lọt vào đây (catch) nghĩa là atob() thất bại -> subData chính là 1 link URL bình thường!
                    // Code sẽ không làm gì cả, tiếp tục dùng finalSubLink = URL cũ.
                }

                // Gắn Link Sub (URL hoặc URL Ảo) vào thẻ Video
                const track = document.createElement('track');
                track.src = finalSubLink; 
                track.kind = 'subtitles'; 
                track.srclang = 'vi';
                track.label = 'Tiếng Việt'; 
                track.default = true;
                player.appendChild(track);

                track.addEventListener('load', function() {
                    const textTrack = player.textTracks[player.textTracks.length - 1];
                    textTrack.mode = 'hidden';
                    textTrack.oncuechange = function() {
                        const cues = textTrack.activeCues;
                        if (cues && cues.length > 0) {
                            customSub.innerHTML = cues[0].text.replace(/\n/g, '<br>');
                            customSub.style.display = 'block';
                        } else {
                            customSub.style.display = 'none';
                        }
                    };
                });
            }
            player.load();
            player.play().catch(function() {});
        }
    </script>
</body>
