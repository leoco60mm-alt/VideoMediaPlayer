<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body.player-mode { overflow: hidden; }

        #setup-box {
            min-height: 100vh;
            padding: 24px 16px 40px;
            background: #0f1115;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .setup-wrap {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.45rem;
            color: #fff;
        }
        .hint {
            margin: 0 0 20px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.55;
        }
        label {
            display: block;
            margin: 14px 0 6px;
            color: #bbb;
            font-size: 14px;
            font-weight: 600;
        }
        #encryptedInput,
        #passwordInput {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #1a1d24;
            color: #e8e8e8;
            font-size: 15px;
            font-family: ui-monospace, Consolas, monospace;
        }
        #passwordInput {
            margin-top: 10px;
        }
        #encryptedInput:focus,
        #passwordInput:focus {
            outline: none;
            border-color: #e50914;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .btn {
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary { background: #e50914; }
        .btn-secondary { background: #2a3142; }
        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .status {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
        .status.show { display: block; }
        .status.loading { background: #1e3a5f; color: #9ecfff; }
        .status.ok { background: #1a3d2a; color: #9effb4; }
        .status.error { background: #3d1a1a; color: #ffb4b4; }
        .hidden-control { display: none !important; }
        .meta {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #1a1d24;
            color: #cfd7e6;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-all;
        }
        .meta.show { display: block; }
        .meta strong { color: #7eb8ff; }

        #preview-box {
            display: none;
            margin-top: 18px;
        }
        #preview-box.show { display: block; }
        #preview-title {
            margin: 0 0 10px;
            color: #ddd;
            font-size: 1rem;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 8px;
            max-height: 320px;
            overflow: auto;
            padding-right: 4px;
        }
        .preview-ep {
            padding: 10px;
            border-radius: 8px;
            background: #252b38;
            color: #dce9ff;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        #movie-box {
            display: none;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #000;
            position: relative;
        }
        #player-shell {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #000;
        }
        #vidPlayer {
            width: 100%;
            flex: 1;
            min-height: 0;
            max-height: calc(100vh - 72px);
            max-height: calc(100dvh - 72px);
            object-fit: contain;
            background: #000;
            outline: none;
        }
        video::cue { color: transparent; background: transparent; }
        #custom-sub {
            position: absolute;
            top: 66.67%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 92%;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9), -2px -2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #video-watermark {
            position: absolute;
            top: 26%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-24deg);
            width: 90%;
            text-align: center;
            font-size: clamp(14px, 4.5vw, 22px);
            font-weight: 600;
            color: #fff;
            opacity: 0.35;
            pointer-events: none;
            z-index: 12;
            user-select: none;
            white-space: nowrap;
        }
        #player-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 7px 12px 10px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
        }
        #progress-bar {
            width: 100%;
            height: 8px;
            padding: 0;
            border: 0;
            margin: 0 0 7px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
        }
        #progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e50914;
            cursor: pointer;
        }
        #progress-bar::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: none;
            border-radius: 50%;
            background: #e50914;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .ctrl-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 19px;
            cursor: pointer;
            padding: 3px 6px;
            line-height: 1;
            flex-shrink: 0;
        }
        #episode-title {
            min-width: 0;
            flex: 1;
            color: #ddd;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #time-display {
            color: #ddd;
            font-size: 12px;
            font-variant-numeric: tabular-nums;
        }
        #movie-box:fullscreen,
        #movie-box:-webkit-full-screen,
        #movie-box.fs-active {
            width: 100vw !important;
            height: 100vh !important;
            height: 100dvh !important;
        }
        #movie-box.fs-active {
            position: fixed !important;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        #top-actions {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 35;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        #btn-back,
        #btn-reload {
            pointer-events: auto;
            border: none;
            border-radius: 999px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 9px 13px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        #episode-side-controls {
            display: none;
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            z-index: 30;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }
        #movie-box.show-player #episode-side-controls { display: flex; }
        #fab-episodes,
        #fab-next-ep {
            background-color: rgba(229, 9, 20, 0.45);
            color: #fff;
            border: none;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s ease, background-color 0.2s ease;
            touch-action: manipulation;
        }
        #fab-episodes {
            border-radius: 30px 0 0 30px;
            padding: 12px 16px 12px 20px;
            font-size: 15px;
            font-weight: bold;
        }
        #fab-next-ep {
            border-radius: 30px 0 0 30px;
            padding: 10px 16px 10px 20px;
            font-size: 20px;
            line-height: 1;
        }
        #fab-episodes:hover,
        #fab-next-ep:hover:not(:disabled) {
            opacity: 0.95;
            background-color: rgba(229, 9, 20, 0.9);
        }
        #fab-next-ep:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .fab-text { display: inline; }

        @media (max-width: 600px) {
            #episode-side-controls {
                gap: 5px;
            }
            #fab-episodes,
            #fab-next-ep {
                width: 42px;
                height: 42px;
                padding: 0;
                border-radius: 22px 0 0 22px;
                font-size: 18px;
                line-height: 42px;
                text-align: center;
            }
            #fab-next-ep {
                font-size: 19px;
            }
            .fab-text {
                display: none;
            }
        }

        #popup-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 110;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        #popup-content {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #1c1c1c;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s ease;
        }
        #popup-overlay.show {
            display: block;
            opacity: 1;
        }
        #popup-overlay.show #popup-content { bottom: 0; }
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .popup-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }
        .list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 20px;
        }
        .ep-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            padding: 13px 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }
        .ep-btn.active {
            background: #e50914;
            color: #fff;
        }
    </style>
</head>
<body>
    <div id="setup-box">
        <div class="setup-wrap">
            <input id="encryptedInput" placeholder="Nhập mã" spellcheck="false" autocomplete="off">
            <input id="passwordInput" type="password" value="1234" placeholder="Mật khẩu giải mã" spellcheck="false" autocomplete="current-password">

            <div class="row">
                <button type="button" class="btn btn-primary" id="btnLoad">Lấy dữ liệu</button>
            </div>

            <div id="status" class="status"></div>
        </div>
    </div>

    <div id="movie-box">
        <div id="top-actions">
            <button type="button" id="btn-back">← Nhập mã khác</button>
            <button type="button" id="btn-reload">Tải lại</button>
        </div>

        <div id="player-shell">
            <video id="vidPlayer" crossorigin="anonymous" playsinline preload="metadata"></video>
            <div id="video-watermark" aria-hidden="true">syhsuah daushd oasdu aodsiu aiud authorization</div>
            <div id="custom-sub"></div>
            <div id="player-controls">
                <input type="range" id="progress-bar" min="0" max="1000" value="0" step="1" aria-label="Tiến trình phát">
                <div class="controls-row">
                    <button type="button" class="ctrl-btn" id="btn-play" aria-label="Phát / Tạm">▶</button>
                    <span id="episode-title">Chưa chọn tập</span>
                    <span id="time-display">0:00 / 0:00</span>
                    <button type="button" class="ctrl-btn" id="btn-fs" aria-label="Toàn màn hình">⛶</button>
                </div>
            </div>
        </div>

        <div id="episode-side-controls">
            <button type="button" id="fab-episodes" aria-label="Chọn tập" title="Chọn tập">☰ <span class="fab-text">Chọn Tập</span></button>
            <button type="button" id="fab-next-ep" aria-label="Tập tiếp theo" title="Tập tiếp theo">▼</button>
        </div>

        <div id="popup-overlay" onclick="togglePopup(false)">
            <div id="popup-content" onclick="event.stopPropagation()">
                <div class="popup-header">
                    <h3>Danh sách tập</h3>
                    <button class="close-btn" onclick="togglePopup(false)">&times;</button>
                </div>
                <div class="list-container" id="epList"></div>
            </div>
        </div>
    </div>

    <script>
        let currentSubtitleBlobUrl = null;
        let hlsInstance = null;
        let playerUiBound = false;
        let isSeeking = false;
        let episodesList = [];
        let currentEpisodeIndex = 0;
        let lastSessionSaveAt = 0;
        const API_BASE = '/api';
        const SESSION_KEY = 'movieCrawlerPlayerState';

        function formatTime(seconds) {
            if (!isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function setStatus(type, message) {
            const el = document.getElementById('status');
            el.className = 'status show ' + type;
            el.textContent = message;
        }

        function hideStatus() {
            const el = document.getElementById('status');
            el.className = 'status';
            el.textContent = '';
        }

        function saveSessionState(extra) {
            if (!episodesList.length) return;

            const player = document.getElementById('vidPlayer');
            const state = {
                episodes: episodesList,
                currentEpisodeIndex: currentEpisodeIndex,
                currentTime: player && isFinite(player.currentTime) ? player.currentTime : 0,
                savedAt: Date.now(),
                ...(extra || {})
            };

            try {
                sessionStorage.setItem(SESSION_KEY, JSON.stringify(state));
            } catch (error) {}
        }

        function readSessionState() {
            try {
                const raw = sessionStorage.getItem(SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (error) {
                return null;
            }
        }

        function clearSessionState() {
            try {
                sessionStorage.removeItem(SESSION_KEY);
            } catch (error) {}
        }

        function base64UrlToBytes(value) {
            let normalized = value.replace(/-/g, '+').replace(/_/g, '/');
            while (normalized.length % 4) normalized += '=';
            const binary = atob(normalized);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function concatBytes(a, b) {
            const out = new Uint8Array(a.length + b.length);
            out.set(a, 0);
            out.set(b, a.length);
            return out;
        }

        async function deriveAesGcmKey(password, salt) {
            const enc = new TextEncoder();
            const baseKey = await crypto.subtle.importKey(
                'raw',
                enc.encode(password || ''),
                'PBKDF2',
                false,
                ['deriveKey']
            );

            return crypto.subtle.deriveKey(
                {
                    name: 'PBKDF2',
                    salt: salt,
                    iterations: 100000,
                    hash: 'SHA-256'
                },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
        }

        async function decryptShareCode(shareCode, password) {
            const parts = (shareCode || '').trim().split('.');
            if (parts.length !== 5 || parts[0].toUpperCase() !== 'MSC1') {
                throw new Error('Dữ liệu mã hoá phải có format MSC1.{salt}.{iv}.{tag}.{ciphertext}');
            }
            if (!window.crypto || !crypto.subtle) {
                throw new Error('Trình duyệt không hỗ trợ WebCrypto. Hãy mở bằng http://localhost hoặc HTTPS.');
            }

            const salt = base64UrlToBytes(parts[1]);
            const iv = base64UrlToBytes(parts[2]);
            const tag = base64UrlToBytes(parts[3]);
            const ciphertext = base64UrlToBytes(parts[4]);
            const encryptedPayload = concatBytes(ciphertext, tag);
            const key = await deriveAesGcmKey(password, salt);
            const aad = new TextEncoder().encode('MSC1');

            const plainBuffer = await crypto.subtle.decrypt(
                {
                    name: 'AES-GCM',
                    iv: iv,
                    additionalData: aad,
                    tagLength: 128
                },
                key,
                encryptedPayload
            );

            return new TextDecoder().decode(plainBuffer).trim();
        }

        function parseMyUrlFromShareCodePlaintext(plaintext) {
            const trimmed = (plaintext || '').trim();
            let watchUrl;

            try {
                watchUrl = new URL(trimmed);
            } catch (error) {
                throw new Error('Giải mã thành công nhưng dữ liệu không phải URL hợp lệ.');
            }

            const protectedData = watchUrl.searchParams.get('data');
            if (!protectedData || !/^MSU1\./i.test(protectedData)) {
                throw new Error('Link bảo vệ không hợp lệ: thiếu tham số data=MSU1...');
            }

            return watchUrl.toString();
        }

        async function resolveProtectedWatchUrl(encryptedText, password) {
            const raw = (encryptedText || '').trim();
            if (!raw) {
                throw new Error('Chưa nhập dữ liệu đã mã hoá.');
            }

            let decryptedText;
            try {
                decryptedText = await decryptShareCode(raw, password || '');
            } catch (error) {
                throw new Error('Giải mã MSC1 thất bại. Kiểm tra mật khẩu hoặc mã chia sẻ.');
            }

            return parseMyUrlFromShareCodePlaintext(decryptedText);
        }

        function escapeHtml(value) {
            const d = document.createElement('div');
            d.textContent = value == null ? '' : String(value);
            return d.innerHTML;
        }

        function normalizeEpisode(item, index) {
            const epText = item.ep || item.name || String(index + 1).padStart(2, '0');
            return {
                ep: epText,
                name: item.name || ('Tập ' + epText),
                watchUrl: item.watchUrl || '',
                videoUrl: item.videoUrl || item.urlVideo || item.url || '',
                subtitleUrl: item.subtitleUrl || item.subUrl || item.urlSub || null
            };
        }

        function mapWatchServerResponse(data) {
            if (!data || typeof data !== 'object') {
                throw new Error('API server trả dữ liệu không hợp lệ.');
            }

            if (data.success === false) {
                const message = data.message || data.error || 'API server từ chối yêu cầu.';
                if (/expir/i.test(message)) {
                    throw new Error('Link đã hết hạn: ' + message);
                }
                throw new Error(message);
            }

            return data;
        }

        function normalizeApiData(data) {
            const mapped = mapWatchServerResponse(data);

            let episodes = [];
            if (Array.isArray(mapped.episodes)) {
                episodes = mapped.episodes;
            } else if (mapped.episode) {
                episodes = [mapped.episode];
            } else if (mapped.videoUrl) {
                episodes = [{
                    ep: '01',
                    name: 'Tập 01',
                    videoUrl: mapped.videoUrl,
                    subtitleUrl: mapped.subtitleUrl || null,
                    watchUrl: mapped.watchUrl || ''
                }];
            }

            episodes = episodes.map(normalizeEpisode).filter(function(ep) {
                return !!ep.videoUrl;
            });

            if (!episodes.length) {
                throw new Error('Không có tập nào có videoUrl để phát.');
            }

            return episodes;
        }

        function buildProtectedWatchRequestUrl(myUrl) {
            const base = API_BASE.replace(/\/+$/, '');
            if (!base) {
                throw new Error('Chưa cấu hình API server.');
            }

            return base + '?data=' + encodeURIComponent(myUrl);
        }

        function getClientDeviceHeaders() {
            return {
                Accept: 'application/json',
                'X-Client-Platform': navigator.platform || '',
                'X-Client-Max-Touch-Points': String(navigator.maxTouchPoints || 0),
                'X-Client-Has-Touch': ('ontouchstart' in window) ? '1' : '0',
                'X-Client-Pointer-Coarse': window.matchMedia && window.matchMedia('(pointer: coarse)').matches ? '1' : '0',
                'X-Client-Hover-None': window.matchMedia && window.matchMedia('(hover: none)').matches ? '1' : '0',
                'X-Client-Screen': [
                    window.screen && window.screen.width,
                    window.screen && window.screen.height,
                    window.devicePixelRatio || 1
                ].join('x')
            };
        }

        async function loadMovieData() {
            const encryptedText = document.getElementById('encryptedInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const btn = document.getElementById('btnLoad');

            try {
                btn.disabled = true;
                setStatus('loading', 'Đang giải mã mã chia sẻ...');

                const myUrl = await resolveProtectedWatchUrl(encryptedText, password);

                setStatus('loading', 'Đang lấy danh sách tập từ server...');

                const apiUrl = buildProtectedWatchRequestUrl(myUrl);
                const res = await fetch(apiUrl, {
                    method: 'GET',
                    headers: getClientDeviceHeaders()
                });

                let data;
                try {
                    data = await res.json();
                } catch (parseError) {
                    throw new Error('API server trả response không phải JSON (HTTP ' + res.status + ').');
                }

                if (!res.ok) {
                    const message = (data && (data.message || data.error)) || ('API server HTTP ' + res.status);
                    if (/expir/i.test(message)) {
                        throw new Error('Link đã hết hạn: ' + message);
                    }
                    throw new Error(message);
                }

                const episodes = normalizeApiData(data);
                episodesList = episodes;
                currentEpisodeIndex = 0;
                saveSessionState({ currentTime: 0 });
                renderEpisodes(episodes);
                enterPlayerMode();
            } catch (err) {
                console.error(err);
                setStatus('error', err.message || 'Không xử lý được dữ liệu.');
            } finally {
                btn.disabled = false;
            }
        }

        function enterPlayerMode() {
            document.body.classList.add('player-mode');
            document.getElementById('setup-box').style.display = 'none';
            document.getElementById('movie-box').style.display = 'flex';
            document.getElementById('movie-box').classList.add('show-player');
        }

        function exitPlayerMode() {
            const player = document.getElementById('vidPlayer');
            if (player) player.pause();
            clearSessionState();
            episodesList = [];
            currentEpisodeIndex = 0;
            document.body.classList.remove('player-mode');
            document.getElementById('movie-box').style.display = 'none';
            document.getElementById('movie-box').classList.remove('show-player');
            document.getElementById('setup-box').style.display = '';
            hideStatus();
        }

        function setupCustomPlayer() {
            const movieBox = document.getElementById('movie-box');
            const player = document.getElementById('vidPlayer');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');
            const btnFs = document.getElementById('btn-fs');
            const timeDisplay = document.getElementById('time-display');
            if (!movieBox || !player || playerUiBound) return;
            playerUiBound = true;

            function getFsEl() {
                return document.fullscreenElement || document.webkitFullscreenElement || null;
            }
            function isFullscreen() {
                return getFsEl() === movieBox || movieBox.classList.contains('fs-active');
            }
            function enterFullscreen() {
                if (movieBox.requestFullscreen) {
                    return movieBox.requestFullscreen().catch(function() {
                        movieBox.classList.add('fs-active');
                    });
                }
                if (movieBox.webkitRequestFullscreen) {
                    try { movieBox.webkitRequestFullscreen(); } catch (e) { movieBox.classList.add('fs-active'); }
                    return;
                }
                movieBox.classList.add('fs-active');
            }
            function exitFullscreen() {
                movieBox.classList.remove('fs-active');
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (getFsEl() === movieBox && exit) exit.call(document);
            }
            function updatePlayIcon() {
                btnPlay.textContent = player.paused ? '▶' : '❚❚';
                btnPlay.setAttribute('aria-label', player.paused ? 'Phát' : 'Tạm');
            }
            function updateTimeUi() {
                const cur = player.currentTime || 0;
                const dur = player.duration || 0;
                timeDisplay.textContent = formatTime(cur) + ' / ' + formatTime(dur);
                if (!isSeeking && dur > 0) {
                    progressBar.value = Math.round((cur / dur) * 1000);
                }
            }

            btnPlay.addEventListener('click', function() {
                if (player.paused) player.play(); else player.pause();
            });
            player.addEventListener('play', updatePlayIcon);
            player.addEventListener('pause', updatePlayIcon);
            player.addEventListener('timeupdate', updateTimeUi);
            player.addEventListener('timeupdate', function() {
                const now = Date.now();
                if (now - lastSessionSaveAt > 5000) {
                    lastSessionSaveAt = now;
                    saveSessionState();
                }
            });
            player.addEventListener('loadedmetadata', updateTimeUi);
            player.addEventListener('durationchange', updateTimeUi);
            player.addEventListener('ended', function() {
                updatePlayIcon();
                saveSessionState({ currentTime: 0 });
                playNextEpisode(true);
            });
            player.addEventListener('error', function() {
                showToast('Không phát được video này');
            });

            progressBar.addEventListener('input', function() {
                isSeeking = true;
                const dur = player.duration;
                if (dur > 0) {
                    const t = (progressBar.value / 1000) * dur;
                    timeDisplay.textContent = formatTime(t) + ' / ' + formatTime(dur);
                }
            });
            progressBar.addEventListener('change', function() {
                const dur = player.duration;
                if (dur > 0) player.currentTime = (progressBar.value / 1000) * dur;
                isSeeking = false;
            });
            progressBar.addEventListener('pointerup', function() { isSeeking = false; });

            btnFs.addEventListener('click', function() {
                if (isFullscreen()) exitFullscreen(); else enterFullscreen();
            });
            function onFsChange() {
                if (!getFsEl()) movieBox.classList.remove('fs-active');
                btnFs.textContent = isFullscreen() ? '⊡' : '⛶';
            }
            document.addEventListener('fullscreenchange', onFsChange);
            document.addEventListener('webkitfullscreenchange', onFsChange);

            player.addEventListener('click', function(e) {
                if (e.target === player) {
                    if (player.paused) player.play(); else player.pause();
                }
            });
        }

        function togglePopup(show) {
            const overlay = document.getElementById('popup-overlay');
            if (show) {
                overlay.style.display = 'block';
                setTimeout(function() { overlay.classList.add('show'); }, 10);
            } else {
                overlay.classList.remove('show');
                setTimeout(function() { overlay.style.display = 'none'; }, 300);
            }
        }

        function updateNextEpButton() {
            const btn = document.getElementById('fab-next-ep');
            if (!btn) return;
            btn.disabled = episodesList.length === 0 || currentEpisodeIndex >= episodesList.length - 1;
        }

        function playEpisodeByIndex(index, fromAuto, startTime) {
            if (index < 0 || index >= episodesList.length) return false;
            currentEpisodeIndex = index;
            document.querySelectorAll('.ep-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            const activeBtn = document.querySelector('.ep-btn[data-index="' + index + '"]');
            if (activeBtn) activeBtn.classList.add('active');
            saveSessionState({ currentTime: startTime || 0 });
            playVideo(episodesList[index], startTime || 0);
            updateNextEpButton();
            if (!fromAuto) togglePopup(false);
            return true;
        }

        function playNextEpisode(fromAuto) {
            if (currentEpisodeIndex + 1 >= episodesList.length) {
                if (!fromAuto) showToast('Đã là tập cuối');
                return false;
            }
            return playEpisodeByIndex(currentEpisodeIndex + 1, fromAuto);
        }

        function renderEpisodes(episodes, initialIndex, initialTime) {
            episodesList = episodes;
            currentEpisodeIndex = Number.isInteger(initialIndex) ? initialIndex : 0;
            const listContainer = document.getElementById('epList');
            listContainer.innerHTML = '';
            episodes.forEach(function(ep, index) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.dataset.index = String(index);
                btn.textContent = ep.name || ('Tập ' + ep.ep);
                btn.onclick = function() {
                    playEpisodeByIndex(index, false);
                };
                listContainer.appendChild(btn);
            });
            if (episodes.length) playEpisodeByIndex(currentEpisodeIndex, true, initialTime || 0);
            else updateNextEpButton();
        }

        function cleanupCurrentMedia() {
            const player = document.getElementById('vidPlayer');
            player.pause();
            player.removeAttribute('src');
            player.innerHTML = '';

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            if (currentSubtitleBlobUrl) {
                URL.revokeObjectURL(currentSubtitleBlobUrl);
                currentSubtitleBlobUrl = null;
            }
        }

        function getVideoType(videoUrl) {
            if (/\.m3u8(\?|$)/i.test(videoUrl)) return 'application/x-mpegURL';
            if (/\.mp4(\?|$)/i.test(videoUrl) || videoUrl.includes('mime_type=video_mp4')) return 'video/mp4';
            return 'video/mp4';
        }

        function attachVideoSource(player, videoUrl) {
            const type = getVideoType(videoUrl);
            if (type === 'application/x-mpegURL') {
                if (player.canPlayType('application/vnd.apple.mpegurl')) {
                    player.src = videoUrl;
                    return;
                }
                if (window.Hls && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(videoUrl);
                    hlsInstance.attachMedia(player);
                    return;
                }
            }

            const source = document.createElement('source');
            source.src = videoUrl;
            source.type = type;
            player.appendChild(source);
        }

        function attachSubtitle(player, subtitleUrl) {
            if (!subtitleUrl) return;

            let finalSubLink = subtitleUrl;
            try {
                const binaryStr = atob(subtitleUrl);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }
                const decodedVttText = new TextDecoder('utf-8').decode(bytes);
                const blob = new Blob([decodedVttText], { type: 'text/vtt;charset=utf-8' });
                finalSubLink = URL.createObjectURL(blob);
                currentSubtitleBlobUrl = finalSubLink;
            } catch (error) {}

            const track = document.createElement('track');
            track.src = finalSubLink;
            track.kind = 'subtitles';
            track.srclang = 'vi';
            track.label = 'Tiếng Việt';
            track.default = true;
            player.appendChild(track);

            track.addEventListener('load', function() {
                const customSub = document.getElementById('custom-sub');
                const textTrack = player.textTracks[player.textTracks.length - 1];
                textTrack.mode = 'hidden';
                textTrack.oncuechange = function() {
                    const cues = textTrack.activeCues;
                    if (cues && cues.length > 0) {
                        customSub.innerHTML = cues[0].text.replace(/\n/g, '<br>');
                        customSub.style.display = 'block';
                    } else {
                        customSub.style.display = 'none';
                    }
                };
            });
        }

        function playVideo(ep, startTime) {
            const player = document.getElementById('vidPlayer');
            const customSub = document.getElementById('custom-sub');
            const progressBar = document.getElementById('progress-bar');
            const btnPlay = document.getElementById('btn-play');
            const title = document.getElementById('episode-title');

            cleanupCurrentMedia();
            customSub.innerHTML = '';
            customSub.style.display = 'none';
            progressBar.value = 0;
            btnPlay.textContent = '▶';
            title.textContent = ep.name || ('Tập ' + ep.ep);

            attachVideoSource(player, ep.videoUrl);
            attachSubtitle(player, ep.subtitleUrl);

            if (startTime > 0) {
                player.addEventListener('loadedmetadata', function restoreTimeOnce() {
                    player.removeEventListener('loadedmetadata', restoreTimeOnce);
                    if (player.duration && startTime < player.duration - 2) {
                        player.currentTime = startTime;
                    }
                });
            }

            player.load();
            player.play().catch(function() {
                showToast('Bấm nút phát nếu trình duyệt chặn autoplay');
            });
        }

        function showToast(message) {
            let el = document.getElementById('ep-toast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'ep-toast';
                el.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:300;pointer-events:none;opacity:0;transition:opacity .2s';
                document.body.appendChild(el);
            }
            el.textContent = message;
            el.style.opacity = '1';
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.style.opacity = '0'; }, 2200);
        }

        function restoreSessionIfAvailable() {
            const state = readSessionState();
            if (!state || !Array.isArray(state.episodes) || !state.episodes.length) {
                return false;
            }

            const episodes = state.episodes.map(normalizeEpisode).filter(function(ep) {
                return !!ep.videoUrl;
            });
            if (!episodes.length) {
                clearSessionState();
                return false;
            }

            const index = Number.isInteger(state.currentEpisodeIndex)
                ? Math.min(Math.max(state.currentEpisodeIndex, 0), episodes.length - 1)
                : 0;
            const time = Number(state.currentTime) > 0 ? Number(state.currentTime) : 0;

            renderEpisodes(episodes, index, time);
            enterPlayerMode();
            return true;
        }

        document.getElementById('btnLoad').addEventListener('click', loadMovieData);
        document.getElementById('btn-back').addEventListener('click', exitPlayerMode);
        document.getElementById('btn-reload').addEventListener('click', function() {
            saveSessionState();
            window.location.reload();
        });
        document.getElementById('fab-episodes').addEventListener('click', function() {
            togglePopup(true);
        });
        document.getElementById('fab-next-ep').addEventListener('click', function() {
            playNextEpisode(false);
        });
        document.getElementById('encryptedInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadMovieData();
        });
        document.getElementById('passwordInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadMovieData();
        });
        window.addEventListener('pagehide', function() {
            saveSessionState();
        });

        window.addEventListener('DOMContentLoaded', function() {
            setupCustomPlayer();
            restoreSessionIfAvailable();
        });
    </script>
</body>
</html>
