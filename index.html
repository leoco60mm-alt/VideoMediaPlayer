<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhúng Trang Web - Chọn Tập</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #setup-box {
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #setup-box h3 {
            text-align: center;
            margin: 0 0 4px;
        }

        #base64-input {
            height: 120px;
            background: #222;
            color: #0f0;
            border: 1px solid #444;
            padding: 15px;
            font-family: monospace;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
        }

        .action-btn {
            padding: 15px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .action-btn:hover { background: #0069d9; }

        #viewer {
            display: none;
            flex: 1;
            position: relative;
            background: #000;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        body.viewing {
            display: flex;
            flex-direction: column;
        }

        body.viewing #setup-box { display: none; }
        body.viewing #viewer { display: block; flex: 1; min-height: 0; }

        #iframe-crop {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        #embed-frame {
            --crop-top: 100px;
            --crop-right: 100px;
            width: calc(100% + var(--crop-right));
            height: calc(100% + var(--crop-top));
            border: none;
            transform: translateY(calc(-1 * var(--crop-top)));
        }

        #error-msg {
            display: none;
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: #e50914;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 110;
            max-width: 90%;
            text-align: center;
        }

        #fab-episodes {
            display: none;
            position: fixed;
            bottom: 25px;
            right: 20px;
            background-color: #e50914;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.5);
            z-index: 90;
            cursor: pointer;
        }

        body.viewing #fab-episodes { display: block; }

        #popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #popup-overlay.show {
            display: block;
            opacity: 1;
        }

        #popup-content {
            position: absolute;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #1c1c1c;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            transition: bottom 0.3s ease;
        }

        #popup-overlay.show #popup-content { bottom: 0; }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .popup-header h3 { margin: 0; font-size: 18px; }

        .close-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 20px;
        }

        .ep-btn {
            background: #2a2a2a;
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            font-weight: bold;
        }

        .ep-btn.active {
            background: #e50914;
            color: #fff;
        }
    </style>
</head>
<body>

    <div id="setup-box">
        <h3>Nhập dữ liệu Base64</h3>
        <textarea id="base64-input" placeholder="Dán mã Base64 (decode ra URL có ep=...)..."></textarea>
        <button type="button" class="action-btn" id="open-btn">Xem ngay</button>
    </div>

    <div id="viewer">
        <div id="iframe-crop">
            <iframe id="embed-frame" title="Trang web nhúng" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-fullscreen"></iframe>
        </div>
    </div>

    <div id="error-msg"></div>

    <button type="button" id="fab-episodes">☰ Chọn tập</button>

    <div id="popup-overlay">
        <div id="popup-content">
            <div class="popup-header">
                <h3>Danh sách tập</h3>
                <button type="button" class="close-btn" id="popup-close">&times;</button>
            </div>
            <div class="list-container" id="ep-list"></div>
        </div>
    </div>

    <script>
        const base64Input = document.getElementById('base64-input');
        const openBtn = document.getElementById('open-btn');
        const viewer = document.getElementById('viewer');
        const embedFrame = document.getElementById('embed-frame');
        const errorMsg = document.getElementById('error-msg');
        const fabEpisodes = document.getElementById('fab-episodes');
        const popupOverlay = document.getElementById('popup-overlay');
        const popupClose = document.getElementById('popup-close');
        const epList = document.getElementById('ep-list');

        let baseUrl = null;
        let totalEpisodes = 0;
        let currentEpisode = 1;

        function decodeBase64ToUrl(base64Data) {
            const trimmed = base64Data.trim();
            const binary = atob(trimmed.replace(/\s/g, ''));
            try {
                return decodeURIComponent(escape(binary)).trim();
            } catch {
                return binary.trim();
            }
        }

        function normalizeUrl(value) {
            if (/^https?:\/\//i.test(value)) return value;
            return 'https://' + value;
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        function togglePopup(show) {
            if (show) {
                popupOverlay.style.display = 'block';
                requestAnimationFrame(() => popupOverlay.classList.add('show'));
            } else {
                popupOverlay.classList.remove('show');
                setTimeout(() => {
                    popupOverlay.style.display = 'none';
                }, 300);
            }
        }

        function buildEpisodeUrl(epNumber) {
            const url = new URL(baseUrl.href);
            url.searchParams.set('ep', String(epNumber));
            return url.href;
        }

        function loadEpisode(epNumber) {
            currentEpisode = epNumber;
            embedFrame.src = buildEpisodeUrl(epNumber);

            document.querySelectorAll('.ep-btn').forEach((btn) => {
                btn.classList.toggle('active', Number(btn.dataset.ep) === epNumber);
            });
        }

        function renderEpisodes() {
            epList.innerHTML = '';

            for (let i = 1; i <= totalEpisodes; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'ep-btn';
                btn.dataset.ep = String(i);
                btn.textContent = `Tập ${i}`;

                btn.addEventListener('click', () => {
                    loadEpisode(i);
                    togglePopup(false);
                });

                epList.appendChild(btn);
            }

            loadEpisode(1);
        }

        function processBase64Data(base64Data) {
            if (!base64Data) {
                showError('Không có dữ liệu Base64');
                return;
            }

            let decodedUrl;
            try {
                decodedUrl = decodeBase64ToUrl(base64Data);
            } catch {
                showError('Mã Base64 không hợp lệ');
                return;
            }

            let parsed;
            try {
                parsed = new URL(normalizeUrl(decodedUrl));
            } catch {
                showError('Decode không ra URL hợp lệ');
                return;
            }

            const epParam = parsed.searchParams.get('ep');
            const total = parseInt(epParam, 10);

            if (!epParam || Number.isNaN(total) || total < 1) {
                showError('URL phải có tham số ep=xx (số tập)');
                return;
            }

            baseUrl = parsed;
            totalEpisodes = total;

            localStorage.setItem('embedBase64', base64Data.trim());

            document.body.classList.add('viewing');
            renderEpisodes();
        }

        function handleManualSubmit() {
            processBase64Data(base64Input.value.trim());
        }

        openBtn.addEventListener('click', handleManualSubmit);

        base64Input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleManualSubmit();
        });

        fabEpisodes.addEventListener('click', () => togglePopup(true));
        popupClose.addEventListener('click', () => togglePopup(false));
        popupOverlay.addEventListener('click', () => togglePopup(false));
        document.getElementById('popup-content').addEventListener('click', (e) => e.stopPropagation());

        window.addEventListener('DOMContentLoaded', () => {
            const xstr = new URLSearchParams(window.location.search).get('xstr');
            if (xstr) {
                processBase64Data(xstr);
                return;
            }

            const saved = localStorage.getItem('embedBase64');
            if (saved) base64Input.value = saved;
        });
    </script>
</body>
</html>
